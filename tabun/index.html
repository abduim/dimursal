<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Табун"><meta name="theme-color" content="#F5F1E9">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json">
</head><body>
<title>Табун</title>
<style>
/* Учёт табуна: тёплый песок степи, зелень пастбища, лошади окрашены по масти */
:root{
  --bg:#F5F1E9; --surface:#FFFFFF; --soft:#ECE5D8; --ink:#2A2118; --mut:#6B5F52; --line:#E2D8C7;
  --acc:#2F6A47; --acc-ink:#FFFFFF; --acc-soft:#E1EEE4;
  --good:#1D7A47; --good-soft:#DFF2E6; --warn:#8F5300; --warn-soft:#FBEED6; --bad:#B3261E; --bad-soft:#FBE3E1; --info:#5644B0; --info-soft:#ECE8FA;
  --wtr:#2C6E9B; --wtr-soft:#E1EDF5; --wa:#1F7A4D; --scrim:rgba(15,25,35,.45); --shadow:0 10px 30px -16px rgba(15,25,35,.45);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15120E; --surface:#201B15; --soft:#2B241C; --ink:#EEE6DA; --mut:#ADA090; --line:#3A3127;
  --acc:#7CC79A; --acc-ink:#0C2416; --acc-soft:#1E3326;
  --good:#5CC98C; --good-soft:#15352A; --warn:#F0B55A; --warn-soft:#3A2C12; --bad:#FF8A80; --bad-soft:#3D1C1A; --info:#B3A6FF; --info-soft:#29234A;
  --wtr:#7DB7E0; --wtr-soft:#1A2D3A; --wa:#1F7A4D; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px -16px rgba(0,0,0,.85); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.kiosk{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,p{margin:0}
h2{font-size:22px;line-height:1.2;font-weight:750;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
.small{font-size:14px}.hint{font-size:13px;color:var(--mut)}.mut{color:var(--mut)}.center{text-align:center}
.mt{margin-top:16px}.mt8{margin-top:8px}
.kicker{font-size:13px;color:var(--mut);font-weight:650;text-transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack{display:grid;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;text-decoration:none;text-align:center;line-height:1.15}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--bad)}
.btn.armed,.ib.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none;padding:0}
.ib.sm{width:40px;height:40px;border-radius:12px}
.ib:disabled{opacity:.35}
.ib.armed{width:auto;padding:0 10px;font-size:13px;font-weight:700}
.linkbtn{background:none;border:0;color:var(--acc);font-weight:650;padding:6px 0;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.form{display:grid;gap:12px}
label.f{display:grid;gap:6px;font-size:14px;color:var(--mut);font-weight:600}
input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:16px;color:var(--ink)}
input[type="time"],input[type="date"]{-webkit-appearance:none;appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:1.2em}.err:empty{min-height:0}
.tg{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.tg input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--acc);flex:none}
.tg.big{font-size:16px;color:var(--ink)}
/* шапка и вкладки */
.top{display:flex;align-items:center;gap:10px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:8px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.logo.big{width:56px;height:56px;border-radius:16px;margin-bottom:12px}.logo.big svg{width:32px;height:32px}
.brand{min-width:0;flex:1;display:grid;line-height:1.2}
.brand b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:13px;color:var(--mut);font-weight:600}
.tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut);min-height:52px;padding:4px 0;border-radius:12px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--acc);background:var(--acc-soft)}
/* день и списки */
.dnav{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.dlab{flex:1;min-width:0;display:grid;text-align:center;line-height:1.2;position:relative}
.dlab b{font-size:18px}.dlab span{font-size:13px;color:var(--mut);font-weight:600}
.dlab input{position:absolute;inset:0;top:0;left:0;width:100%;height:100%;opacity:0;min-height:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;display:grid;gap:2px;text-align:center;min-width:0}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--mut);font-weight:650;line-height:1.2;overflow-wrap:anywhere}
.tile.good .v{color:var(--good)}.tile.warn{background:var(--warn-soft);border-color:transparent}.tile.warn .v{color:var(--warn)}.tile.bad{background:var(--bad-soft);border-color:transparent}.tile.bad .v{color:var(--bad)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--ink);min-height:64px}
.row .t{flex:1;min-width:0;display:grid;gap:2px}
.row .t b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>svg{color:var(--mut)}
.st{font-size:14px;font-weight:600;line-height:1.3}
.st.good{color:var(--good)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}.st.mut{color:var(--mut)}.st.info{color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;line-height:1.5;background:var(--soft);color:var(--mut)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--acc-soft);color:var(--acc);flex:none}
.av.good{background:var(--good-soft);color:var(--good)}.av.warn{background:var(--warn-soft);color:var(--warn)}.av.bad{background:var(--bad-soft);color:var(--bad)}.av.mut{background:var(--soft);color:var(--mut)}.av.info{background:var(--info-soft);color:var(--info)}
.av.xl{width:84px;height:84px;font-size:30px;margin:0 auto 10px}
.pin{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.12em;color:var(--mut);font-size:15px}
.pin.big{font-size:30px;color:var(--ink)}
.pinrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}
.onb ol,.steps{margin:10px 0 0;padding-left:20px;display:grid;gap:8px}
.busy{display:flex;align-items:center;gap:10px;color:var(--mut)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;gap:6px}.seg.wrap{flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seg.two{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg.two button{border:0;border-radius:11px;background:transparent;min-height:40px;color:var(--mut)}
.seg.two button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mb{margin-bottom:12px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.three .v{font-size:17px}
.tile.acc{background:var(--acc-soft);border-color:transparent}.tile.acc .v{color:var(--acc)}
.sum{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.pays{display:grid;gap:6px}
.pi{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.pi .t{flex:1;min-width:0;display:grid}
.kmon{margin-top:12px;font-size:15px;color:var(--mut);font-weight:600}
.kcard.mine .tiles{margin-top:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.sum.neg{color:var(--bad)}
.kcard.mine .list{text-align:left}
.fw b{font-size:16px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.fgrid figure{margin:0;display:grid;gap:4px;min-width:0}
.fgrid .ph{width:100%;height:auto;aspect-ratio:3/4;min-height:96px;border-radius:12px}
.fgrid .ref .ph{outline:2px dashed var(--line);outline-offset:-2px;opacity:.85}
.fgrid figcaption{font-size:12px;color:var(--mut);font-weight:650;line-height:1.3;text-align:center}
.sched{display:grid;gap:6px}
.sd{display:grid;grid-template-columns:62px minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;min-height:48px}
.sd .tg{min-height:40px;font-size:15px}
.sd input[type="time"]{min-height:42px;padding:6px 6px;font-size:15px;text-align:center}
.sd .small{grid-column:2/5}
/* отметки с фото */
.marks{display:grid;gap:8px}
.mk{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.mk .t{flex:1;min-width:0;display:grid;gap:2px}
.ph{width:64px;height:64px;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--mut)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph.none img{display:none}
.pv{position:fixed;z-index:200;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:24px}
.pv img{max-width:100%;max-height:85vh;border-radius:12px}
.pv .ib{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:16px}
/* календарь месяца */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.cw,.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw span{text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.cd{border:0;background:none;border-radius:10px;min-height:44px;display:grid;justify-items:center;align-content:center;gap:3px;padding:2px;color:var(--ink)}
.cd b{font-size:14px;font-variant-numeric:tabular-nums}
.cd i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.cd.good i{background:var(--good)}.cd.warn i{background:var(--warn)}.cd.bad i{background:var(--bad)}.cd.info i{background:var(--info)}.cd.mut i{background:var(--line)}
.cd.bad{background:var(--bad-soft)}.cd.warn{background:var(--warn-soft)}
.cd.fut{color:var(--mut);opacity:.5}.cd.fut i{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:5px;border-radius:3px;display:inline-block}
.legend i.good{background:var(--good)}.legend i.warn{background:var(--warn)}.legend i.bad{background:var(--bad)}.legend i.info{background:var(--info)}.legend i.mut{background:var(--line)}
/* лист снизу */
#sheet{position:fixed;z-index:50;top:0;right:0;bottom:0;left:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh-head .t{flex:1;min-width:0}
#toast{position:fixed;z-index:300;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:650;text-align:center;box-shadow:var(--shadow)}
#toast.bad{background:var(--bad);color:#fff}
body.kiosk #toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
/* вход */
#login{position:fixed;z-index:100;top:0;right:0;bottom:0;left:0;background:var(--bg);overflow-y:auto;padding:max(48px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.lgbox{max-width:420px;margin:0 auto}.lgbox h2{margin-bottom:6px}
/* экран у входа */
.kwrap{max-width:520px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top,0px))}
.kh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.kt{display:grid;min-width:0;line-height:1.25}.kt b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kt span{font-size:14px;color:var(--mut);font-weight:600}
.kclock{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 16px;text-align:center;box-shadow:var(--shadow)}
.kq{font-size:20px;font-weight:750}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0 6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc);display:block}
.dots i.on{background:var(--acc)}
.dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.kerr{color:var(--bad);font-weight:650;min-height:1.5em;font-size:15px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pad button{min-height:68px;border-radius:18px;border:1px solid var(--line);background:var(--bg);font-size:28px;font-weight:700;color:var(--ink);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--acc-soft)}
.pad button svg{width:28px;height:28px}
.kcard.who h2{font-size:26px;margin-bottom:4px}
.kacts{display:grid;gap:10px;margin-top:18px}
.btn.xl{min-height:64px;font-size:20px;border-radius:18px}
.btn.xl svg{width:24px;height:24px}
.vbox{position:relative;width:min(100%,320px);aspect-ratio:3/4;min-height:240px;margin:14px auto 0;border-radius:20px;overflow:hidden;background:#000}
.vbox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}

.kcard.done{padding-top:28px}
.big-ok{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--good-soft);color:var(--good)}
.big-ok svg{width:42px;height:42px;stroke-width:2.6}
.kcard.done.warn .big-ok{background:var(--warn-soft);color:var(--warn)}
.kcard.done h2{font-size:26px}.kcard.done p{font-size:18px;margin-top:6px}
.kstat{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px;margin-top:14px;font-size:18px;font-weight:750}
.kstat.good{background:var(--good-soft);color:var(--good)}.kstat.warn{background:var(--warn-soft);color:var(--warn)}.kstat.mut{background:var(--soft);color:var(--mut)}
.kstat svg{width:24px;height:24px;stroke-width:2.6}
.btn.in{background:var(--good);border-color:var(--good);color:#fff}
.btn.out{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ktime{font-size:56px!important;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:4px 0 2px!important}
.kbar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:16px}
.kbar i{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left;animation:kb linear forwards}
@keyframes kb{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.big-ok.q{background:var(--warn-soft);color:var(--warn);font-size:44px;font-weight:800}
.kcard.conf p{font-size:18px;margin-top:8px}
.klast{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--good-soft);color:var(--good);font-weight:700;text-align:center}
.klast svg{flex:none}
.knote{background:var(--warn-soft);color:var(--warn);font-weight:700;border-radius:14px;padding:12px;margin-top:14px!important;font-size:16px!important}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.kclock{font-size:36px}.pad button{min-height:60px}}
@media (min-width:700px){#app{max-width:680px;margin:0 auto}.top{max-width:680px;margin:0 auto}}

.hero{display:grid;justify-items:center;text-align:center;padding:10px 0 4px}
.hero .big{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .l{color:var(--mut);font-weight:650;margin-top:4px}
.bars{display:grid;gap:6px}

<script>
'use strict';
/* ---------- мелочи ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const pad = n => (n < 10 ? '0' : '') + n;
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const a = String(s).split('-').map(Number); return new Date(a[0], (a[1] || 1) - 1, a[2] || 1); };
const TODAY = () => ds(new Date());
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const dBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const uid = p => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s));
const int = (v, lo, hi, def) => { const n = Math.round(Number(String(v).replace(/[\s ]/g, '').replace(',', '.'))); return isFinite(n) && n >= lo && n <= hi ? n : def; };
const num = v => { const n = Number(String(v == null ? '' : v).replace(/[\s ]/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const str = (v, n) => String(v == null ? '' : v).slice(0, n);
function pl(n, a, b, c) { n = Math.abs(n) % 100; const k = n % 10; return n > 10 && n < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; }
const MG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const fDs = s => { if (!isDate(s)) return ''; const d = pd(s); return d.getDate() + ' ' + MG[d.getMonth()]; };
const fDy = s => { if (!isDate(s)) return ''; const d = pd(s); return d.getDate() + ' ' + MG[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const fDf = s => { if (!isDate(s)) return ''; const d = pd(s); return d.getDate() + ' ' + MG[d.getMonth()] + ' ' + d.getFullYear(); };
const money = n => Math.round(n || 0).toLocaleString('ru-RU') + ' ₸';
const kg = n => (Math.round(n * 10) / 10).toLocaleString('ru-RU') + ' кг';
const lsGet = (k, def) => { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е');

/* ---------- лошади: возраст и группы ---------- */
function ageMonths(born, on) { if (!isDate(born)) return null; const a = pd(born), b = pd(on || TODAY()); let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth(); if (b.getDate() < a.getDate()) m--; return Math.max(0, m); }
function ageTxt(born) {
  const m = ageMonths(born); if (m == null) return 'возраст неизвестен';
  if (m < 12) return m + ' ' + pl(m, 'месяц', 'месяца', 'месяцев');
  const y = Math.floor(m / 12), r = m % 12;
  return y + ' ' + pl(y, 'год', 'года', 'лет') + (y < 3 && r ? ' ' + r + ' мес' : '');
}
/* казахские названия по возрасту — проверить с фермером */
const CATS = {
  kulyn: {kz: 'Құлын', ru: 'жеребёнок до 6 мес', ord: 8},
  zhabagy: {kz: 'Жабағы', ru: 'жеребёнок 6–12 мес', ord: 7},
  tai: {kz: 'Тай', ru: '1–2 года', ord: 6},
  kunan: {kz: 'Құнан', ru: 'жеребчик 2–3 года', ord: 4},
  kunazhyn: {kz: 'Құнажын', ru: 'кобылка 2–3 года', ord: 5},
  donen: {kz: 'Дөнен', ru: 'жеребчик 3–4 года', ord: 2},
  donezhin: {kz: 'Дөнежін', ru: 'кобылка 3–4 года', ord: 3},
  bie: {kz: 'Бие', ru: 'кобыла', ord: 1},
  aigyr: {kz: 'Айғыр', ru: 'жеребец', ord: 0},
  akta: {kz: 'Ақта', ru: 'мерин', ord: 2.5},
  unk: {kz: 'Без возраста', ru: 'дата рождения не указана', ord: 9}
};
const CAT_ORDER = ['aigyr', 'bie', 'akta', 'donen', 'donezhin', 'kunan', 'kunazhyn', 'tai', 'zhabagy', 'kulyn', 'unk'];
function catOf(h, on) {
  const m = ageMonths(h.born, on);
  if (m == null) return h.sex === 'f' ? 'bie' : h.cast ? 'akta' : 'unk';
  if (m < 6) return 'kulyn';
  if (m < 12) return 'zhabagy';
  if (m < 24) return 'tai';
  if (m < 36) return h.sex === 'f' ? 'kunazhyn' : 'kunan';
  if (m < 48) return h.sex === 'f' ? 'donezhin' : 'donen';

function toast(t, bad) { const el = $('#toast'); el.textContent = t; el.className = bad ? 'bad' : ''; el.hidden = false; clearTimeout(TT); TT = setTimeout(() => { el.hidden = true; }, bad ? 4200 : 2400); }
async function copy(text, ok) {

  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast(ok || 'Скопировано'); } catch (x) { toast('Не удалось скопировать', true); } t.remove(); }
}

/* кнопка, которую нужно нажать дважды */
function armed(btn, label, fn) {
  btn.onclick = () => {
    if (btn.dataset.armed) { fn(); return; }
    const old = btn.innerHTML; btn.dataset.armed = '1'; btn.classList.add('armed'); btn.textContent = label;
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.classList.remove('armed'); btn.innerHTML = old; } }, 3500);
  };
}
async function act(f, ok) { try { await f(); if (ok) toast(ok); return true; } catch (e) { toast(errText(e), true); return false; } }
function errText(e) {
  const c = String((e && e.code) || '').replace(/^firestore\//, '');
  if (c === 'tag') return 'Лошадь с такой биркой уже есть.';
  if (c === 'permission-denied') return 'Нет доступа. Выйдите и войдите заново.';
  if (c === 'unauthenticated') return 'Вход истёк. Войдите заново.';
  if (c === 'resource-exhausted') return 'Достигнут дневной лимит облака. Попробуйте завтра.';
  if (c === 'pin') return 'Такой код уже у другого работника.';
  return 'Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.';
}

/* ---------- сохранение файла на телефон ---------- */
async function saveFile(filename, data) {
  const type = /\.csv$/.test(filename) ? 'text/csv' : 'application/json';
  const blob = new Blob([type === 'text/csv' ? '﻿' + data : data], {type});
  try {
    if (window.File && navigator.canShare) {
      const f = new File([blob], filename, {type});
      if (navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: filename}); return true; }
    }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}
const csvCell = v => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csvOf = rows => rows.map(r => r.map(csvCell).join(';')).join('\r\n');

/* ---------- фото: сжатие ---------- */
function loadImg(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
function toJpeg(src, w, h, max, q) {
  const k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q || .62);
}
async function fileToJpeg(file) {
  const url = URL.createObjectURL(file);
  try { const img = await loadImg(url); return toJpeg(img, img.naturalWidth, img.naturalHeight, 360, .62); }
  finally { URL.revokeObjectURL(url); }
}

  let h = `<div class="sec-h" style="margin-top:8px"><h2>Косяки и группы</h2><button class="btn small" data-newg>${I.plus}Новый</button></div><div class="list">`;
  h += GS.map(g => {
    const m = HS.filter(x => alive(x) && x.grp === g.id), st = hz(g.stallion), by = {};
    m.forEach(x => { const c = catOf(x); by[c] = (by[c] || 0) + 1; });
    const parts = CAT_ORDER.filter(c => by[c]).map(c => CATS[c].kz + ' ' + by[c]);
    return `<button class="row grow" data-gopen="${esc(g.id)}">${st ? horseAv(st) : `<span class="ic acc">${I.list}</span>`}<span class="t"><b>${esc(g.name)}</b><span class="st mut">${esc(parts.join(' · ') || 'пока пусто')}</span>${g.place ? `<span class="small mut">${esc(g.place)}</span>` : ''}</span><span class="cnt">${m.length}</span></button>`;
  }).join('') + '</div>';
  const none = HS.filter(x => alive(x) && !grp(x.grp)).length;
  if (none) h += `<p class="small mut mt">Без косяка: ${none} ${pl(none, 'лошадь', 'лошади', 'лошадей')}. <button class="linkbtn" data-go="list">Найти в списке</button></p>`;
  return h;
}

/* --- итоги года --- */

  if (s.meatList.length) h += '<div class="sec-h"><h3>Забой</h3></div><div class="list">' + s.meatList.map(x => `<button class="row" data-h="${esc(x.h.id)}">${horseAv(x.h)}<span class="t"><b>${esc(hName(x.h))}</b><span class="st mut">${esc(fDs(x.e.d) + (x.e.t ? ' · ' + x.e.t : ''))}</span></span><span class="cnt">${x.e.v ? kg(x.e.v) : ''}</span></button>`).join('') + '</div>';
  if (s.deadList.length) h += '<div class="sec-h"><h3>Падёж</h3></div><div class="list">' + s.deadList.map(x => `<button class="row" data-h="${esc(x.h.id)}">${horseAv(x.h)}<span class="t"><b>${esc(hName(x.h))}</b><span class="st mut">${esc(fDs(x.e.d) + (x.e.t ? ' · ' + x.e.t : ''))}</span></span></button>`).join('') + '</div>';
  h += `<div class="sec-h"><h3>Для Excel</h3></div><div class="stack"><button class="btn ghost" data-csv="horses">${I.save}Список лошадей</button><button class="btn ghost" data-csv="events">${I.save}Все события за ${y} год</button></div>`;
  return h;
}
function exportCsv(kind) {
  if (kind === 'horses') {
    const rows = [['Бирка', 'Кличка', 'Группа', 'Пол', 'Мерин', 'Масть', 'Дата рождения', 'Возраст', 'Косяк', 'Мать', 'Отец', 'Последний вес, кг', 'Статус', 'Дата выбытия']];
    HS.slice().sort((a, b) => a.tag.localeCompare(b.tag)).forEach(h => { const w = weights(h).pop(), g = grp(h.grp); rows.push([h.tag, h.name, CATS[catOf(h)].kz, h.sex === 'f' ? 'кобыла' : 'жеребец', h.cast ? 'да' : '', h.color, h.born, ageTxt(h.born), g ? g.name : '', hz(h.mother) ? hz(h.mother).tag : '', hz(h.father) ? hz(h.father).tag : '', w ? w.v : '', ST[h.st], h.stD]); });
    saveFile('tabun-loshadi-' + TODAY() + '.csv', csvOf(rows));
  } else {
    const body = [];
    HS.forEach(h => h.ev.forEach(e => { if (e.d.slice(0, 4) === String(V.y)) body.push([e.d, h.tag, h.name, EVK[e.k], e.t || '', e.v != null ? String(e.v).replace('.', ',') : '', e.nx || '']); }));
    body.sort((a, b) => String(a[0]).localeCompare(String(b[0])));
    saveFile('tabun-sobytiya-' + V.y + '.csv', csvOf([['Дата', 'Бирка', 'Кличка', 'Событие', 'Что', 'Число', 'Следующая дата']].concat(body)));
  }
}

function lostAgo(h) { if (!h.stD) return 'пропала'; const n = dBetween(h.stD, TODAY()); return n <= 0 ? 'пропала сегодня' : n === 1 ? 'пропала вчера' : 'пропала ' + n + ' ' + pl(n, 'день', 'дня', 'дней') + ' назад, ' + fDs(h.stD); }

/* ---------- карточка лошади ---------- */
function spark(ws) {
  if (ws.length < 2) return '';
  const W = 280, H = 56, xs = ws.map(e => pd(e.d).getTime()), ys = ws.map(e => e.v);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const X = t => 6 + (x1 === x0 ? (W - 12) / 2 : (t - x0) / (x1 - x0) * (W - 12)), Y = v => H - 8 - (y1 === y0 ? (H - 16) / 2 : (v - y0) / (y1 - y0) * (H - 16));
  const pts = ws.map(e => X(pd(e.d).getTime()).toFixed(1) + ',' + Y(e.v).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Вес: от ${Math.round(ys[0])} до ${Math.round(ys[ys.length - 1])} кг"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${ws.map(e => `<circle cx="${X(pd(e.d).getTime()).toFixed(1)}" cy="${Y(e.v).toFixed(1)}" r="3.5" fill="var(--surface)" stroke="var(--acc)" stroke-width="2"/>`).join('')}</svg>`;
}
function horseSheet(id) {

    const h = hz(id); if (!h) { closeSheet(); return; }
    const c = catOf(h), g = grp(h.grp), mo = hz(h.mother), fa = hz(h.father), T = TODAY(), ws = weights(h), v = vacState(h);
    const kids = HS.filter(x => x.mother === h.id || x.father === h.id).sort((a, b) => b.born.localeCompare(a.born));
    let x = `<div class="sh-head"><div class="hh"><button class="phbtn" id="hPh" aria-label="${h.ph ? 'Фото лошади' : 'Добавить фото'}">${horseAv(h, 'lg')}<span class="camb">${I.cam}</span></button><div class="t"><p class="kicker">${esc(CATS[c].kz + ' · ' + CATS[c].ru)}</p><h2>${esc(h.name || (h.tag ? '№ ' + h.tag : 'Без бирки'))}</h2><p class="small mut">${esc([h.tag && h.name ? 'бирка ' + h.tag : '', h.color, ageTxt(h.born) + (h.approx ? ' (примерно)' : '')].filter(Boolean).join(' · '))}</p></div></div>${closeBtn}</div>`;
    if (h.st === 'lost') x += `<div class="banner bad"><p><b>${esc(lostAgo(h).replace(/^п/, 'П'))}.</b>${lostWhere(h) ? ' Последний раз: ' + esc(lostWhere(h)) + '.' : ''}</p><div class="row2 mt8"><button class="btn small" id="hFound">${I.check}Нашлась</button><button class="btn small ghost" id="hAd">${I.chat}Объявление</button></div><button class="linkbtn mt8" id="hWrite">Не нашлась: списать</button></div>`;
    else if (!alive(h)) x += `<div class="banner bad"><p><b>${esc(ST[h.st])}</b>${h.stD ? ' ' + esc(fDy(h.stD)) : ''}.</p><button class="linkbtn" id="hBack">Вернуть в табун</button></div>`;
    if (!h.ph && alive(h)) x += `<button class="btn ghost full mb" id="hAddPh">${I.cam}Добавить фото</button>`;
    x += '<section class="card"><dl class="kv">';
    x += `<dt>Косяк</dt><dd>${g ? `<button class="linkbtn" data-g="${esc(g.id)}">${esc(g.name)}</button>` : 'не указан'}</dd>`;
    x += `<dt>Пол</dt><dd>${h.sex === 'f' ? 'кобыла' : h.cast ? 'мерин' : 'жеребец'}</dd>`;
    x += `<dt>Родилась</dt><dd>${h.born ? esc(fDf(h.born)) + (h.approx ? ' (примерно)' : '') : 'неизвестно'}</dd>`;
    x += `<dt>Мать</dt><dd>${mo ? `<button class="linkbtn" data-hh="${esc(mo.id)}">${esc(hName(mo))}</button>` : '—'}</dd>`;
    x += `<dt>Отец</dt><dd>${fa ? `<button class="linkbtn" data-hh="${esc(fa.id)}">${esc(hName(fa))}</button>` : '—'}</dd>`;
    x += '</dl>' + (h.note ? `<p class="small mt8">${esc(h.note)}</p>` : '') + '</section>';
    if (alive(h)) x += `<div class="acts mt">${[['w', I.scale, 'Взвесить'], ['vac', I.syr, 'Прививка'], ['move', I.move, 'Перевести']].concat(h.sex === 'f' && ageMonths(h.born) >= 30 ? [['foal', I.baby, 'Приплод']] : []).map(a => `<button data-ev="${a[0]}">${a[1]}<span>${a[2]}</span></button>`).join('')}</div>`;
    x += `<div class="sec-h"><h3>Вес</h3>${ws.length ? `<b>${Math.round(ws[ws.length - 1].v)} кг</b>` : ''}</div>`;
    x += ws.length ? `<section class="card">${spark(ws.slice(-8))}<p class="small mut">${ws.slice(-4).reverse().map(e => fDs(e.d) + ' — ' + Math.round(e.v) + ' кг').join(' · ')}</p>${ws.length > 1 ? `<p class="small mt8">С ${esc(fDs(ws[0].d))}: ${(ws[ws.length - 1].v - ws[0].v >= 0 ? '+' : '') + Math.round(ws[ws.length - 1].v - ws[0].v)} кг</p>` : ''}</section>` : '<p class="small mut">Не взвешивали.</p>';
    const vk = Object.keys(v).sort();
    x += '<div class="sec-h"><h3>Прививки и обработки</h3></div>';
    x += vk.length ? '<div class="list">' + vk.map(k => { const e = v[k], od = e.nx && e.nx < T; return `<div class="row static"><span class="ic ${od ? 'bad' : 'acc'}">${I.syr}</span><span class="t"><b>${esc(k)}</b><span class="st ${od ? 'bad' : 'mut'}">была ${esc(fDy(e.d))}${e.nx ? (od ? ' · просрочена с ' : ' · следующая ') + esc(fDy(e.nx)) : ''}</span></span></div>`; }).join('') + '</div>' : '<p class="small mut">Записей нет.</p>';
    x += pedHtml(h);
    if (kids.length) x += `<div class="sec-h"><h3>${h.sex === 'f' ? 'Приплод' : 'Потомство'}</h3><span class="mut">${kids.length}</span></div><div class="list">` + kids.slice(0, 12).map(k => `<button class="row" data-hh="${esc(k.id)}">${horseAv(k)}<span class="t"><b>${esc(hName(k))}</b><span class="st mut">${esc((k.sex === 'f' ? 'кобылка' : 'жеребчик') + ' · ' + (k.born ? fDy(k.born) : '') + (alive(k) ? '' : ' · ' + ST[k.st].toLowerCase()))}</span></span></button>`).join('') + '</div>';
    x += '<div class="sec-h"><h3>История</h3></div>';
    x += h.ev.length ? '<div class="hist">' + h.ev.slice().reverse().slice(0, 40).map(e => `<div class="he"><span class="d">${esc(fDy(e.d))}</span><span class="t"><b>${esc(EVK[e.k])}${e.k === 'vac' && e.t ? ': ' + esc(e.t) : ''}</b>${evLine(e)}</span><button class="ib sm" data-edel="${esc(e.id)}" aria-label="Удалить запись">${I.trash}</button></div>`).join('') + '</div>' : '<p class="small mut">Пока пусто.</p>';
    if (alive(h)) x += `<div class="stack mt"><div class="row3">${[['sold', I.cash, 'Продажа'], ['meat', I.meat, 'Забой'], ['dead', I.cross, 'Падёж']].map(a => `<button class="btn ghost small" data-ev="${a[0]}">${a[1]}${a[2]}</button>`).join('')}</div><button class="btn ghost small" data-ev="lost">Пропала</button><button class="btn ghost small" data-ev="note">${I.edit}Заметка</button></div>`;
    x += `<button class="btn ghost full mt" id="hEdit">${I.edit}Изменить данные</button>`;
    openSheet(x, st);
    $$('[data-hh]').forEach(b => b.onclick = () => horseSheet(b.dataset.hh));
    $$('[data-g]').forEach(b => b.onclick = () => groupSheet(b.dataset.g));
    $$('[data-ev]').forEach(b => b.onclick = () => { const k = b.dataset.ev; if (k === 'foal') foalSheet(h.id); else evSheet([h.id], k, () => horseSheet(h.id)); });
    $('#hEdit').onclick = () => editHorse(h.id);
    $$('[data-pedset]').forEach(b => b.onclick = () => editHorse(h.id));
    $('#hPh').onclick = () => photoMenu(h);
    const ap = $('#hAddPh'); if (ap) ap.onclick = () => pickPhoto(h);
    const hf = $('#hFound'); if (hf) hf.onclick = () => foundSheet(h.id);
    const ha = $('#hAd'); if (ha) ha.onclick = () => lostAd(h);
    const hw = $('#hWrite'); if (hw) armed(hw, 'Списать как павшую?', () => { const n = clone(h); n.st = 'dead'; n.stD = TODAY(); n.ev.push({id: uid('e'), d: TODAY(), k: 'dead', t: 'пропала и не нашлась'}); act(() => API.saveH(n), 'Списана.'); });
    const hb = $('#hBack'); if (hb) armed(hb, 'Нажмите ещё раз', () => { const n = clone(h); n.st = 'in'; n.stD = ''; n.ev.push({id: uid('e'), d: TODAY(), k: 'back'}); act(() => API.saveH(n), 'Лошадь снова в табуне.'); });
    $$('[data-edel]').forEach(b => armed(b, 'Удалить?', () => {
      const n = clone(h), e = n.ev.find(z => z.id === b.dataset.edel); n.ev = n.ev.filter(z => z.id !== b.dataset.edel);
      if (e && (e.k === 'sold' || e.k === 'meat' || e.k === 'dead' || e.k === 'lost') && n.st === e.k) { n.st = 'in'; n.stD = ''; }
      act(() => API.saveH(n), 'Запись удалена.');
    }));
  };
  st.redraw = draw;
  draw();
}
function evLine(e) {
  const p = [];
  if (e.k === 'w' && e.v) p.push(Math.round(e.v) + ' кг');
  if (e.k === 'sold' && e.v) p.push(money(e.v));
  if (e.k === 'meat' && e.v) p.push(kg(e.v) + ' мяса');
  if (e.k === 'foal') { const c = hz(e.c); p.push(e.x ? 'жеребёнок погиб' : c ? (c.sex === 'f' ? 'кобылка ' : 'жеребчик ') + hName(c) : 'жеребёнок'); }
  if (e.k === 'move' && e.g) { const g = grp(e.g); p.push('в ' + (g ? g.name : 'другую группу')); }
  if (e.k === 'vac' && e.nx) p.push('следующая ' + fDy(e.nx));
  if (e.t && e.k !== 'vac') p.push(e.t);
  return p.length ? `<span class="small mut">${esc(p.join(' · '))}</span>` : '';
}

/* ---------- новая лошадь и изменение ---------- */
function editHorse(id, pre) {
  const old = id ? hz(id) : null;
  const F = old ? clone(old) : Object.assign({id: uid('h'), tag: nextTag(), name: '', sex: 'f', cast: false, color: SET.masts[0], born: '', approx: false, grp: '', mother: '', father: '', st: 'in', stD: '', note: '', ev: [], ts: Date.now()}, pre || {});
  F.mTag = hz(F.mother) ? hz(F.mother).tag : ''; F.fTag = hz(F.father) ? hz(F.father).tag : '';
  const draw = () => {
    let x = head(old ? hName(old) : 'Новая лошадь', old ? 'Изменить данные' : 'Добавить лошадь');
    x += `<div class="form"><div class="row2"><label class="f" for="eTag">Бирка<input id="eTag" autocomplete="off" inputmode="numeric" value="${esc(F.tag)}"></label><label class="f" for="eName">Кличка<input id="eName" autocomplete="off" value="${esc(F.name)}" placeholder="необязательно"></label></div>
      <div class="seg wrap">${[['f', 'Кобыла'], ['m', 'Жеребец'], ['c', 'Мерин']].map(o => `<button data-sx="${o[0]}" aria-pressed="${(o[0] === 'c' ? F.sex === 'm' && F.cast : o[0] === 'm' ? F.sex === 'm' && !F.cast : F.sex === 'f')}">${o[1]}</button>`).join('')}</div>
      <div class="row2"><label class="f" for="eBorn">Дата рождения<input id="eBorn" type="date" value="${esc(F.born)}" max="${TODAY()}"></label><label class="f" for="eColor">Масть${mastSel("eColor", F.color)}</label></div>
      <label class="tg"><input type="checkbox" id="eApprox" ${F.approx ? 'checked' : ''}><span>Дата рождения примерная</span></label>
      <label class="f" for="eGrp">Косяк или группа<select id="eGrp"><option value="">— не указан —</option>${GS.map(g => `<option value="${esc(g.id)}" ${g.id === F.grp ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label>
      <div class="row2"><label class="f" for="eM">Бирка матери<input id="eM" autocomplete="off" inputmode="numeric" value="${esc(F.mTag)}" placeholder="если знаете"></label><label class="f" for="eF">Бирка отца<input id="eF" autocomplete="off" inputmode="numeric" value="${esc(F.fTag)}" placeholder="если знаете"></label></div>
      <label class="f" for="eNote">Заметка<input id="eNote" autocomplete="off" value="${esc(F.note)}" placeholder="Например: тавро на левом бедре"></label>
      <p class="err" id="eErr"></p><button class="btn" id="eSave">${old ? 'Сохранить' : 'Добавить'}</button></div>`;
    if (old) x += `<section class="card mt"><h3>Удалить запись</h3><p class="small mut">Только если лошадь добавлена по ошибке. Если её продали или она пала, отметьте это в карточке: так сохранится история.</p><button class="btn ghost danger full mt8" id="eDel">${I.trash}Удалить</button></section>`;
    openSheet(x, {kind: 'eh'});
    const sync = () => { F.tag = $('#eTag').value.trim(); F.name = $('#eName').value.trim(); F.born = $('#eBorn').value; F.color = mastVal('eColor'); F.approx = $('#eApprox').checked; F.grp = $('#eGrp').value; F.mTag = $('#eM').value.trim(); F.fTag = $('#eF').value.trim(); F.note = $('#eNote').value.trim(); };
    $$('[data-sx]').forEach(b => b.onclick = () => { sync(); const v = b.dataset.sx; F.sex = v === 'f' ? 'f' : 'm'; F.cast = v === 'c'; draw(); });
    $('#eSave').onclick = () => {
      sync();
      const err = t => { $('#eErr').textContent = t; };
      if (!F.tag && !F.name) return err('Впишите бирку или кличку.');
      if (F.tag && HS.some(h => h.id !== F.id && h.tag === F.tag)) return err('Лошадь с биркой ' + F.tag + ' уже есть.');
      const m = F.mTag ? HS.find(h => h.tag === F.mTag) : null, f = F.fTag ? HS.find(h => h.tag === F.fTag) : null;
      if (F.mTag && !m) return err('Не нашла кобылу с биркой ' + F.mTag + '.');
      if (F.fTag && !f) return err('Не нашла жеребца с биркой ' + F.fTag + '.');
      if (m && m.sex !== 'f') return err('Мать должна быть кобылой.');
      F.mother = m ? m.id : ''; F.father = f ? f.id : '';
      const n = clone(F); delete n.mTag; delete n.fTag;
      if (!old && !n.ev.length) n.ev = [{id: uid('e'), d: TODAY(), k: 'note', t: 'добавлена в учёт'}];
      act(() => API.saveH(n), old ? 'Сохранено.' : 'Лошадь добавлена.').then(ok => { if (ok) horseSheet(n.id); });
    };
    const del = $('#eDel'); if (del) armed(del, 'Удалить совсем?', () => act(() => API.delH(old.id), 'Запись удалена.').then(ok => { if (ok) closeSheet(); }));
  };
  draw();
}

/* ---------- приплод ---------- */
function pickMare() {
  const st = {kind: 'pm', q: ''};
  const draw = () => {
    const q = norm(st.q).trim(), L = HS.filter(h => alive(h) && h.sex === 'f' && ageMonths(h.born) >= 30 && (!q || norm(h.tag).indexOf(q) >= 0 || norm(h.name).indexOf(q) >= 0)).sort((a, b) => a.tag.localeCompare(b.tag)).slice(0, 40);
    openSheet(head('Приплод', 'Чей жеребёнок?') + `<label class="srch" for="pmq">${I.search}<input id="pmq" type="search" placeholder="Бирка или кличка кобылы" value="${esc(st.q)}" autocomplete="off"></label><div class="list mt8">${L.map(h => `<button class="row" data-pm="${esc(h.id)}">${horseAv(h)}<span class="t"><b>${esc(hName(h))}</b><span class="st mut">${esc((grp(h.grp) ? grp(h.grp).name : '') + ' · ' + ageTxt(h.born))}</span></span></button>`).join('')}</div>`, st);
    const q2 = $('#pmq'); q2.oninput = () => { st.q = q2.value; const p = q2.selectionStart; draw(); const n = $('#pmq'); n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} };

/* ---------- события для одной или многих лошадей ---------- */
function evSheet(ids, k, back) {
  const many = ids.length > 1, h1 = hz(ids[0]);
  const F = {d: TODAY(), v: '', t: '', nx: 'none', nxd: addD(TODAY(), 182), g: '', name: SET.vacs[0], reason: 'болезнь'};
  const title = {w: 'Взвешивание', vac: 'Прививка или обработка', move: 'Перевод в другой косяк', sold: 'Продажа', meat: 'Забой', dead: 'Падёж', lost: 'Пропала', note: 'Заметка'}[k];
  const draw = () => {
    let x = head(many ? ids.length + ' ' + pl(ids.length, 'лошадь', 'лошади', 'лошадей') : hName(h1), title);
    x += `<div class="form"><label class="f" for="vD">Дата<input id="vD" type="date" value="${esc(F.d)}" max="${TODAY()}"></label>`;
    if (k === 'w') x += `<label class="f" for="vV">Вес, кг<input id="vV" inputmode="decimal" autocomplete="off" value="${esc(F.v)}"></label>`;
    if (k === 'vac') x += `<label class="f" for="vN">Что сделали<select id="vN">${SET.vacs.map(v => `<option ${v === F.name ? 'selected' : ''}>${esc(v)}</option>`).join('')}<option value="__other" ${F.name === '__other' ? 'selected' : ''}>Другое…</option></select></label>${F.name === '__other' ? `<label class="f" for="vNo">Название<input id="vNo" autocomplete="off" value="${esc(F.t)}"></label>` : ''}
      <p class="small mut">Когда повторить</p><div class="seg wrap">${[['none', 'Не нужно'], ['182', 'Через полгода'], ['365', 'Через год'], ['date', 'Дата']].map(o => `<button data-nx="${o[0]}" aria-pressed="${F.nx === o[0]}">${o[1]}</button>`).join('')}</div>${F.nx === 'date' ? `<label class="f" for="vNx">Следующая дата<input id="vNx" type="date" value="${esc(F.nxd)}"></label>` : ''}`;
    if (k === 'move') x += `<label class="f" for="vG">Куда<select id="vG">${GS.map(g => `<option value="${esc(g.id)}" ${g.id === F.g ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label>`;
    if (k === 'sold') x += `<label class="f" for="vV">Цена, ₸<input id="vV" inputmode="numeric" autocomplete="off" value="${esc(F.v)}"></label><label class="f" for="vT">Кому продали<input id="vT" autocomplete="off" value="${esc(F.t)}"></label>`;
    if (k === 'meat') x += `<label class="f" for="vV">Мяса, кг<input id="vV" inputmode="decimal" autocomplete="off" value="${esc(F.v)}"></label><label class="f" for="vT">Заметка<input id="vT" autocomplete="off" value="${esc(F.t)}" placeholder="Например: соғым"></label>`;
    if (k === 'dead') x += `<div class="seg wrap">${['болезнь', 'волки', 'непогода', 'травма', 'другое'].map(r => `<button data-rs="${r}" aria-pressed="${F.reason === r}">${r}</button>`).join('')}</div><label class="f" for="vT">Подробности<input id="vT" autocomplete="off" value="${esc(F.t)}"></label>`;
    if (k === 'lost' || k === 'note') x += `<label class="f" for="vT">${k === 'note' ? 'Текст' : 'Где последний раз видели'}<input id="vT" autocomplete="off" value="${esc(F.t)}"></label>`;
    if (many && k === 'vac') x += `<p class="hint">Запись появится у каждой из ${ids.length} лошадей.</p>`;
    x += `<p class="err" id="vErr"></p><button class="btn" id="vGo">Сохранить</button>${back ? '<button class="btn ghost mt8" id="vBack">Назад</button>' : ''}</div>`;
    openSheet(x, {kind: 'ev'});
    const sync = () => { F.d = $('#vD').value; const v = $('#vV'); if (v) F.v = v.value; const t = $('#vT'); if (t) F.t = t.value; const n = $('#vN'); if (n) F.name = n.value; const no = $('#vNo'); if (no) F.t = no.value; const nx = $('#vNx'); if (nx) F.nxd = nx.value; const g = $('#vG'); if (g) F.g = g.value; };
    const vn = $('#vN'); if (vn) vn.onchange = () => { sync(); draw(); };
    $$('[data-nx]').forEach(b => b.onclick = () => { sync(); F.nx = b.dataset.nx; draw(); });
    $$('[data-rs]').forEach(b => b.onclick = () => { sync(); F.reason = b.dataset.rs; draw(); });
    const bk = $('#vBack'); if (bk) bk.onclick = back;
    $('#vGo').onclick = () => {
      sync();

      if (!isDate(F.d)) return err('Укажите дату.');
      const e = {id: '', d: F.d, k};
      if (k === 'w') { const v = num(F.v); if (!(v > 10 && v < 1500)) return err('Впишите вес в килограммах.'); e.v = v; }
      if (k === 'vac') {
        const name = F.name === '__other' ? F.t.trim() : F.name; if (!name) return err('Впишите, что сделали.'); e.t = name;
        if (F.nx === 'date') { if (!isDate(F.nxd) || F.nxd <= F.d) return err('Следующая дата должна быть позже.'); e.nx = F.nxd; } else if (F.nx !== 'none') e.nx = addD(F.d, Number(F.nx));

      if (k === 'meat') { const v = num(F.v); if (F.v && !(v > 0)) return err('Вес мяса цифрами.'); if (v > 0) e.v = v; if (F.t.trim()) e.t = F.t.trim(); }
      if (k === 'dead') e.t = F.reason + (F.t.trim() ? ': ' + F.t.trim() : '');
      if ((k === 'lost' || k === 'note') && F.t.trim()) e.t = F.t.trim();
      if (k === 'note' && !e.t) return err('Впишите текст.');
      const list = ids.map(id => { const h = clone(hz(id)); if (!h) return null; h.ev.push(Object.assign({}, e, {id: uid('e')})); if (k === 'move') h.grp = F.g; if (k === 'sold' || k === 'meat' || k === 'dead' || k === 'lost') { h.st = k; h.stD = F.d; } return h; }).filter(Boolean);
      const okMsg = many ? 'Записано для ' + list.length + ' ' + pl(list.length, 'лошади', 'лошадей', 'лошадей') + '.' : 'Записано.';
      act(() => API.saveMany(list), okMsg).then(ok => { if (!ok) return; if (V.sel) { V.sel = null; render(); } if (back && !many) back(); else closeSheet(); });
    };
  };
  draw();
}

  h += '<div class="list mt">' + S.map(x => { const t = wTone(x.s); return `<button class="row wrow" data-w="${esc(x.w.id)}"><span class="ic ${t === 'good' ? 'wtr' : t}">${WI.drop}</span><span class="t"><b>${esc(x.w.name)}</b><span class="st ${t === 'good' ? 'mut' : t}">${esc(wLine(x.w, x.s))}</span><span class="small mut">${esc(x.w.grps.map(g => grp(g) ? grp(g).name : '').filter(Boolean).join(', ') || 'косяки не указаны')}</span></span>${x.s && !x.s.nodata ? tankHtml(x.s.level, t) : ''}</button>`; }).join('') + '</div>';

/* --- карта (Leaflet лежит рядом с программой, грузится только когда нужна) --- */
let LFP = null, WMAP = null, WMAPEL = null, WLAYER = null;
function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (LFP) return LFP;
  LFP = new Promise((res, rej) => {
    const c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'lib/leaflet.css'; document.head.appendChild(c);
    const s = document.createElement('script'); s.src = 'lib/leaflet.js';
    s.onload = () => window.L ? res(window.L) : rej(new Error('leaflet'));
    s.onerror = () => { LFP = null; s.remove(); rej(new Error('leaflet')); };
    document.head.appendChild(s);
  });
  return LFP;
}
function tiles(LF) { return LF.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, crossOrigin: true, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}); }
function lfMap(LF, el, o) { const m = LF.map(el, Object.assign({zoomControl: true, attributionControl: true}, o || {})); m.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>'); tiles(LF).addTo(m); return m; }
function wIcon(LF, tone) { return LF.divIcon({className: 'wmk ' + tone, html: '<span>' + WI.drop + '</span>', iconSize: [34, 34], iconAnchor: [17, 17]}); }
async function drawWellMap() {
  const slot = $('#wmap'); if (!slot) return;
  let LF; try { LF = await loadLeaflet(); } catch (e) { if (document.body.contains(slot)) slot.innerHTML = '<p class="wmap-ph">Карта появится, когда будет интернет.</p>'; return; }
  if (!document.body.contains(slot)) return;
  if (!WMAPEL) { WMAPEL = document.createElement('div'); WMAPEL.className = 'wmapin'; }
  slot.innerHTML = ''; slot.appendChild(WMAPEL);
  let fit = false;
  if (!WMAP) { WMAP = lfMap(LF, WMAPEL); WLAYER = LF.layerGroup().addTo(WMAP); fit = true; }
  WMAP.invalidateSize();
  WLAYER.clearLayers();
  const pts = [];
  WS.forEach(w => {
    if (w.lat == null) return;
    const s = wsim(w), t = wTone(s);
    const mk = LF.marker([w.lat, w.lon], {icon: wIcon(LF, t === 'good' ? 'wtr' : t), title: w.name, keyboard: true});
    mk.bindTooltip(esc(w.name), {permanent: true, direction: 'bottom', offset: [0, 14], className: 'wtip'});
    mk.on('click', () => wellSheet(w.id));
    WLAYER.addLayer(mk); pts.push([w.lat, w.lon]);
  });
  if (fit) {
    if (pts.length > 1) WMAP.fitBounds(LF.latLngBounds(pts).pad(0.2), {maxZoom: 13});
    else if (pts.length) WMAP.setView(pts[0], 12);
    else WMAP.setView(SET.loc ? [SET.loc.lat, SET.loc.lon] : [47.8333, 59.6], 9);
  }
}

/* --- карточка колодца --- */
function wChart(s) {
  const D = s.days, W = 300, H = 92, B = 76, n = D.length, gap = 2, bw = (W - gap * (n - 1)) / n;
  const mx = Math.max.apply(null, D.map(d => d.v).concat([s.avg])) * 1.08, Y = v => B - v / mx * (B - 4), low = s.avg * 0.6;
  const bar = (x, y, w, h) => { const r = Math.min(4, w / 2, h); return `M${x.toFixed(1)},${B}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)},${y.toFixed(1)} ${(x + w).toFixed(1)},${(y + r).toFixed(1)}V${B}Z`; };
  let g = `<line x1="0" x2="${W}" y1="${B}" y2="${B}" stroke="var(--line)" stroke-width="1"/>`;
  D.forEach((d, i) => { const x = i * (bw + gap), y = Y(d.v); g += `<path d="${bar(x, y, bw, B - y)}" fill="${d.v < low ? 'var(--warn)' : 'var(--wtr)'}"/>`; });
  g += `<line x1="0" x2="${W}" y1="${Y(s.avg).toFixed(1)}" y2="${Y(s.avg).toFixed(1)}" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  g += `<text x="0" y="${H - 2}" font-size="10" fill="var(--mut)">${esc(fDs(D[0].d))}</text><text x="${W}" y="${H - 2}" font-size="10" fill="var(--mut)" text-anchor="end">вчера</text>`;
  D.forEach((d, i) => { g += `<rect class="hit" data-ci="${i}" x="${(i * (bw + gap)).toFixed(1)}" y="0" width="${(bw + gap).toFixed(1)}" height="${B}" fill="transparent"/>`; });
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Сколько воды выпивали за 14 дней: от ${fmtL(Math.min.apply(null, D.map(d => d.v)))} до ${fmtL(Math.max.apply(null, D.map(d => d.v)))} в день">${g}</svg>`;
}

    const ch = $('#sheet .wchart'); if (ch) $$('.hit', ch).forEach(b => b.onclick = () => { const d = s.days[Number(b.dataset.ci)]; $('#wcap').textContent = fDs(d.d) + ': ' + fmtL(d.v) + (d.v < s.avg * 0.6 ? ' — намного меньше обычного' : ''); $$('.hit', ch).forEach(z => z.classList.toggle('on', z === b)); });

function refreshW(id) { if (SHEET && SHEET.kind === 'w' + id && SHEET.redraw) SHEET.redraw(); if (V.tab === 'wells' || V.tab === 'home') render(); }

      <p class="small mut">Какие косяки здесь пьют</p><div class="chips">${GS.map(g => `<button class="fchip" data-wg="${esc(g.id)}" aria-pressed="${F.grps.indexOf(g.id) >= 0}">${esc(g.name)}</button>`).join('')}</div>
      <label class="tg"><input type="checkbox" id="wA" ${F.auto ? 'checked' : ''}><span>Стоит автодолив (поплавок или датчик)</span></label>

    openSheet(x, {kind: 'ew'});

    const coordTxt = () => { $('#wCoord').textContent = F.lat != null ? 'Точка: ' + F.lat.toFixed(5) + ', ' + F.lon.toFixed(5) + '. Нажмите на карту, чтобы передвинуть.' : 'Нажмите на карту, где колодец, или определите место по телефону.'; };
    $$('[data-wk]').forEach(b => b.onclick = () => { sync(); F.kind = b.dataset.wk; $$('[data-wk]').forEach(z => z.setAttribute('aria-pressed', String(z === b))); });
    $$('[data-wg]').forEach(b => b.onclick = () => { const g = b.dataset.wg, i = F.grps.indexOf(g); if (i >= 0) F.grps.splice(i, 1); else F.grps.push(g); b.setAttribute('aria-pressed', String(i < 0)); });
    let mk = null;
    const place = (LF, m) => { if (F.lat == null) return; if (mk) mk.setLatLng([F.lat, F.lon]); else mk = LF.marker([F.lat, F.lon], {icon: wIcon(LF, 'wtr')}).addTo(m); };

      const c = F.lat != null ? [F.lat, F.lon] : WS.filter(w => w.lat != null).length ? [WS.filter(w => w.lat != null)[0].lat, WS.filter(w => w.lat != null)[0].lon] : SET.loc ? [SET.loc.lat, SET.loc.lon] : [47.8333, 59.6];

        if (PICKMAP && window.L) { place(window.L, PICKMAP); PICKMAP.setView([F.lat, F.lon], 14); }
      }, e => { coordTxt(); $('#wErr').textContent = e && e.code === 1 ? 'Разрешите доступ к месту в настройках браузера или нажмите на карту.' : 'Не удалось определить место. Нажмите на карту.'; }, {enableHighAccuracy: true, timeout: 20000, maximumAge: 60000});
    };
    $('#wSave').onclick = () => {
      sync();
      if (!F.name) { $('#wErr').textContent = 'Впишите название.'; return; }
      act(() => API.saveW(cleanW(F.id, F)), old ? 'Сохранено.' : 'Колодец добавлен.').then(ok => { if (ok) wellSheet(F.id); });
    };
    const del = $('#wDel'); if (del) armed(del, 'Удалить совсем?', () => act(() => API.delW(old.id), 'Колодец удалён.').then(ok => { if (ok) closeSheet(); }));
  };
  draw();
}

/* ---------- хранение: пример в памяти телефона (облако подключим для настоящего учёта) ---------- */
const DKEY = 'tabun-demo-v4';
let DATA = null;
function applyData() {
  Object.keys(HM).forEach(k => delete HM[k]);
  HS = Object.keys(DATA.horses).map(id => cleanH(id, DATA.horses[id]));
  WS = Object.keys(DATA.wells || {}).map(id => cleanW(id, DATA.wells[id])).sort((a, b) => a.ord - b.ord || a.name.localeCompare(b.name, 'ru'));
  GS = Object.keys(DATA.groups).map(id => cleanG(id, DATA.groups[id])).sort((a, b) => a.ord - b.ord || a.name.localeCompare(b.name, 'ru'));
  SET = cleanSet(DATA.settings);
  derive();
}
function persist() { if (!lsSet(DKEY, DATA)) toast('Память телефона заполнена: изменения могут не сохраниться.', true); }
function changed() { applyData(); render(); if (SHEET && SHEET.redraw) SHEET.redraw(); }
const API = {
  async saveH(h) { DATA.horses[h.id] = packH(h); persist(); changed(); },
  async saveMany(list) { list.forEach(h => { DATA.horses[h.id] = packH(h); }); persist(); changed(); },
  async delH(id) { delete DATA.horses[id]; persist(); changed(); },
  async saveG(g) { DATA.groups[g.id] = {name: g.name, stallion: g.stallion, place: g.place, kind: g.kind, ord: g.ord}; persist(); changed(); },
  async delG(id) { delete DATA.groups[id]; persist(); changed(); },
  async saveW(w) { DATA.wells = DATA.wells || {}; DATA.wells[w.id] = packW(w); persist(); changed(); },
  async delW(id) { if (DATA.wells) delete DATA.wells[id]; persist(); changed(); },
  async saveSet(s) { DATA.settings = {farm: s.farm, phone: s.phone, vacs: s.vacs, masts: s.masts, loc: s.loc || null}; persist(); changed(); },
  backup() { return {app: 'tabun', v: 1, at: new Date().toISOString(), horses: DATA.horses, groups: DATA.groups, wells: DATA.wells || {}, settings: DATA.settings}; }
};
function resetDemo() {
  DATA = demoData(); DATA.settings = DEMO_SET(); DATA.wells = demoWells();
  persist(); V.tab = 'home'; V.sel = null; V.q = ''; V.cat = ''; V.g = ''; changed(); window.scrollTo(0, 0);
  toast('Пример начат заново.');
}
const DEMO_SET = () => ({farm: 'Пример: КХ «Ақбоз»', loc: {name: 'Шалкар', lat: 47.8333, lon: 59.6}});
/* ---------- запуск ---------- */
$$('.tabs button').forEach(b => b.onclick = () => { V.tab = b.dataset.tab; if (V.tab !== 'list') V.sel = null; window.scrollTo(0, 0); render(); });
$('#openSet').onclick = settingsSheet;
(function start() {
  DATA = lsGet(DKEY, null);
  if (!DATA || !DATA.horses || !DATA.groups) { DATA = demoData(); DATA.settings = DEMO_SET(); persist(); }
  if (!DATA.wells) { DATA.wells = demoWells(); persist(); }
  MODE = 'demo';
  applyData(); render();
  wxLoad(false);
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) wxLoad(false); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>Табун</title>
<style>
/* Учёт табуна: тёплый песок степи, зелень пастбища, лошади окрашены по масти */
:root{
  --bg:#F5F1E9; --surface:#FFFFFF; --soft:#ECE5D8; --ink:#2A2118; --mut:#6B5F52; --line:#E2D8C7;
  --acc:#2F6A47; --acc-ink:#FFFFFF; --acc-soft:#E1EEE4;
  --good:#1D7A47; --good-soft:#DFF2E6; --warn:#8F5300; --warn-soft:#FBEED6; --bad:#B3261E; --bad-soft:#FBE3E1; --info:#5644B0; --info-soft:#ECE8FA;
  --wtr:#2C6E9B; --wtr-soft:#E1EDF5; --wa:#1F7A4D; --scrim:rgba(15,25,35,.45); --shadow:0 10px 30px -16px rgba(15,25,35,.45);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15120E; --surface:#201B15; --soft:#2B241C; --ink:#EEE6DA; --mut:#ADA090; --line:#3A3127;
  --acc:#7CC79A; --acc-ink:#0C2416; --acc-soft:#1E3326;
  --good:#5CC98C; --good-soft:#15352A; --warn:#F0B55A; --warn-soft:#3A2C12; --bad:#FF8A80; --bad-soft:#3D1C1A; --info:#B3A6FF; --info-soft:#29234A;
  --wtr:#7DB7E0; --wtr-soft:#1A2D3A; --wa:#1F7A4D; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px -16px rgba(0,0,0,.85); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.kiosk{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,p{margin:0}
h2{font-size:22px;line-height:1.2;font-weight:750;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
.small{font-size:14px}.hint{font-size:13px;color:var(--mut)}.mut{color:var(--mut)}.center{text-align:center}
.mt{margin-top:16px}.mt8{margin-top:8px}
.kicker{font-size:13px;color:var(--mut);font-weight:650;text-transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack{display:grid;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;text-decoration:none;text-align:center;line-height:1.15}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--bad)}
.btn.armed,.ib.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none;padding:0}
.ib.sm{width:40px;height:40px;border-radius:12px}
.ib:disabled{opacity:.35}
.ib.armed{width:auto;padding:0 10px;font-size:13px;font-weight:700}
.linkbtn{background:none;border:0;color:var(--acc);font-weight:650;padding:6px 0;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.form{display:grid;gap:12px}
label.f{display:grid;gap:6px;font-size:14px;color:var(--mut);font-weight:600}
input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:16px;color:var(--ink)}
input[type="time"],input[type="date"]{-webkit-appearance:none;appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:1.2em}.err:empty{min-height:0}
.tg{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.tg input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--acc);flex:none}
.tg.big{font-size:16px;color:var(--ink)}
/* шапка и вкладки */
.top{display:flex;align-items:center;gap:10px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:8px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.logo.big{width:56px;height:56px;border-radius:16px;margin-bottom:12px}.logo.big svg{width:32px;height:32px}
.brand{min-width:0;flex:1;display:grid;line-height:1.2}
.brand b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:13px;color:var(--mut);font-weight:600}
.tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut);min-height:52px;padding:4px 0;border-radius:12px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--acc);background:var(--acc-soft)}
/* день и списки */
.dnav{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.dlab{flex:1;min-width:0;display:grid;text-align:center;line-height:1.2;position:relative}
.dlab b{font-size:18px}.dlab span{font-size:13px;color:var(--mut);font-weight:600}
.dlab input{position:absolute;inset:0;top:0;left:0;width:100%;height:100%;opacity:0;min-height:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;display:grid;gap:2px;text-align:center;min-width:0}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--mut);font-weight:650;line-height:1.2;overflow-wrap:anywhere}
.tile.good .v{color:var(--good)}.tile.warn{background:var(--warn-soft);border-color:transparent}.tile.warn .v{color:var(--warn)}.tile.bad{background:var(--bad-soft);border-color:transparent}.tile.bad .v{color:var(--bad)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--ink);min-height:64px}
.row .t{flex:1;min-width:0;display:grid;gap:2px}
.row .t b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>svg{color:var(--mut)}
.st{font-size:14px;font-weight:600;line-height:1.3}
.st.good{color:var(--good)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}.st.mut{color:var(--mut)}.st.info{color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;line-height:1.5;background:var(--soft);color:var(--mut)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--acc-soft);color:var(--acc);flex:none}
.av.good{background:var(--good-soft);color:var(--good)}.av.warn{background:var(--warn-soft);color:var(--warn)}.av.bad{background:var(--bad-soft);color:var(--bad)}.av.mut{background:var(--soft);color:var(--mut)}.av.info{background:var(--info-soft);color:var(--info)}
.av.xl{width:84px;height:84px;font-size:30px;margin:0 auto 10px}
.pin{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.12em;color:var(--mut);font-size:15px}
.pin.big{font-size:30px;color:var(--ink)}
.pinrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}
.onb ol,.steps{margin:10px 0 0;padding-left:20px;display:grid;gap:8px}
.busy{display:flex;align-items:center;gap:10px;color:var(--mut)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;gap:6px}.seg.wrap{flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seg.two{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg.two button{border:0;border-radius:11px;background:transparent;min-height:40px;color:var(--mut)}
.seg.two button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mb{margin-bottom:12px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.three .v{font-size:17px}
.tile.acc{background:var(--acc-soft);border-color:transparent}.tile.acc .v{color:var(--acc)}
.sum{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.pays{display:grid;gap:6px}
.pi{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.pi .t{flex:1;min-width:0;display:grid}
.kmon{margin-top:12px;font-size:15px;color:var(--mut);font-weight:600}
.kcard.mine .tiles{margin-top:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.sum.neg{color:var(--bad)}
.kcard.mine .list{text-align:left}
.fw b{font-size:16px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.fgrid figure{margin:0;display:grid;gap:4px;min-width:0}
.fgrid .ph{width:100%;height:auto;aspect-ratio:3/4;min-height:96px;border-radius:12px}
.fgrid .ref .ph{outline:2px dashed var(--line);outline-offset:-2px;opacity:.85}
.fgrid figcaption{font-size:12px;color:var(--mut);font-weight:650;line-height:1.3;text-align:center}
.sched{display:grid;gap:6px}
.sd{display:grid;grid-template-columns:62px minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;min-height:48px}
.sd .tg{min-height:40px;font-size:15px}
.sd input[type="time"]{min-height:42px;padding:6px 6px;font-size:15px;text-align:center}
.sd .small{grid-column:2/5}
/* отметки с фото */
.marks{display:grid;gap:8px}
.mk{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.mk .t{flex:1;min-width:0;display:grid;gap:2px}
.ph{width:64px;height:64px;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--mut)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph.none img{display:none}
.pv{position:fixed;z-index:200;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:24px}
.pv img{max-width:100%;max-height:85vh;border-radius:12px}
.pv .ib{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:16px}
/* календарь месяца */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.cw,.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw span{text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.cd{border:0;background:none;border-radius:10px;min-height:44px;display:grid;justify-items:center;align-content:center;gap:3px;padding:2px;color:var(--ink)}
.cd b{font-size:14px;font-variant-numeric:tabular-nums}
.cd i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.cd.good i{background:var(--good)}.cd.warn i{background:var(--warn)}.cd.bad i{background:var(--bad)}.cd.info i{background:var(--info)}.cd.mut i{background:var(--line)}
.cd.bad{background:var(--bad-soft)}.cd.warn{background:var(--warn-soft)}
.cd.fut{color:var(--mut);opacity:.5}.cd.fut i{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:5px;border-radius:3px;display:inline-block}
.legend i.good{background:var(--good)}.legend i.warn{background:var(--warn)}.legend i.bad{background:var(--bad)}.legend i.info{background:var(--info)}.legend i.mut{background:var(--line)}
/* лист снизу */
#sheet{position:fixed;z-index:50;top:0;right:0;bottom:0;left:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh-head .t{flex:1;min-width:0}
#toast{position:fixed;z-index:300;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:650;text-align:center;box-shadow:var(--shadow)}
#toast.bad{background:var(--bad);color:#fff}
body.kiosk #toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
/* вход */
#login{position:fixed;z-index:100;top:0;right:0;bottom:0;left:0;background:var(--bg);overflow-y:auto;padding:max(48px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.lgbox{max-width:420px;margin:0 auto}.lgbox h2{margin-bottom:6px}
/* экран у входа */
.kwrap{max-width:520px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top,0px))}
.kh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.kt{display:grid;min-width:0;line-height:1.25}.kt b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kt span{font-size:14px;color:var(--mut);font-weight:600}
.kclock{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 16px;text-align:center;box-shadow:var(--shadow)}
.kq{font-size:20px;font-weight:750}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0 6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc);display:block}
.dots i.on{background:var(--acc)}
.dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.kerr{color:var(--bad);font-weight:650;min-height:1.5em;font-size:15px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pad button{min-height:68px;border-radius:18px;border:1px solid var(--line);background:var(--bg);font-size:28px;font-weight:700;color:var(--ink);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--acc-soft)}
.pad button svg{width:28px;height:28px}
.kcard.who h2{font-size:26px;margin-bottom:4px}
.kacts{display:grid;gap:10px;margin-top:18px}
.btn.xl{min-height:64px;font-size:20px;border-radius:18px}
.btn.xl svg{width:24px;height:24px}
.vbox{position:relative;width:min(100%,320px);aspect-ratio:3/4;min-height:240px;margin:14px auto 0;border-radius:20px;overflow:hidden;background:#000}
.vbox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}

.kcard.done{padding-top:28px}
.big-ok{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--good-soft);color:var(--good)}
.big-ok svg{width:42px;height:42px;stroke-width:2.6}
.kcard.done.warn .big-ok{background:var(--warn-soft);color:var(--warn)}
.kcard.done h2{font-size:26px}.kcard.done p{font-size:18px;margin-top:6px}
.kstat{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px;margin-top:14px;font-size:18px;font-weight:750}
.kstat.good{background:var(--good-soft);color:var(--good)}.kstat.warn{background:var(--warn-soft);color:var(--warn)}.kstat.mut{background:var(--soft);color:var(--mut)}
.kstat svg{width:24px;height:24px;stroke-width:2.6}
.btn.in{background:var(--good);border-color:var(--good);color:#fff}
.btn.out{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ktime{font-size:56px!important;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:4px 0 2px!important}
.kbar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:16px}
.kbar i{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left;animation:kb linear forwards}
@keyframes kb{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.big-ok.q{background:var(--warn-soft);color:var(--warn);font-size:44px;font-weight:800}
.kcard.conf p{font-size:18px;margin-top:8px}
.klast{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--good-soft);color:var(--good);font-weight:700;text-align:center}
.klast svg{flex:none}
.knote{background:var(--warn-soft);color:var(--warn);font-weight:700;border-radius:14px;padding:12px;margin-top:14px!important;font-size:16px!important}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.kclock{font-size:36px}.pad button{min-height:60px}}
@media (min-width:700px){#app{max-width:680px;margin:0 auto}.top{max-width:680px;margin:0 auto}}

.hero{display:grid;justify-items:center;text-align:center;padding:10px 0 4px}
.hero .big{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .l{color:var(--mut);font-weight:650;margin-top:4px}
.bars{display:grid;gap:6px}

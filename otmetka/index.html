}
function kDone(w, k, at, again) {
  const T = TODAY(), r = dayInfo(w, T, marksOf(w.id, T), nowS()), m = minOf(at), nm = w.name.split(/\s+/)[0];
  let tone = 'good', note = '';
  if (!r.sc.off) {
    if (k === 'in' && m > tm(r.sc.f) + SET.grace && !r.marks.some(x => x.k === 'in' && x.at < at - 1000)) { tone = 'warn'; note = 'Опоздание: ' + durTxt(m - tm(r.sc.f)) + '. Начало по графику в ' + r.sc.f + '.'; }
    if (k === 'out' && m < tm(r.sc.t) - SET.grace) { tone = 'warn'; note = 'Уход раньше графика на ' + durTxt(tm(r.sc.t) - m) + '. Конец по графику в ' + r.sc.t + '.'; }
  }
  if (k === 'lout' && SET.lunch) { const l = r.marks.filter(x => x.k === 'lin').pop(); if (l && at - l.at > SET.lunchMax * 60000) { tone = 'warn'; note = 'Обед длился ' + durTxt((at - l.at) / 60000) + ', это дольше ' + durTxt(SET.lunchMax) + '.'; } }
  const title = {in: 'Приход отмечен', out: 'Уход отмечен', lin: 'Обед отмечен', lout: 'Возвращение отмечено'}[k];
  const greet = {in: 'Добро пожаловать, ' + nm + '!', out: 'До свидания, ' + nm + '!', lin: 'Приятного аппетита, ' + nm + '!', lout: nm + ', хорошей работы!'}[k];
  const ms = again ? 6000 : 8000;
  K.step = 'done'; K.conf = null; K.done = {tone, title: again ? 'Уже отмечено' : title, time: fT(at), text: again ? nm + ', повторять не нужно.' : greet, note, ms};
  K.last = {text: nm + ': ' + title.toLowerCase() + ' в ' + fT(at), until: Date.now() + 90000};
  chime(tone === 'good');
  kIdle(ms);
  renderKiosk();
}

function exportMonth(m) {
  const rows = [['Работник', 'Должность', 'Рабочих дней по графику', 'Был на работе, дней', 'Часов', 'Опозданий', 'Минут опозданий', 'Ранних уходов', 'Минут раньше', 'Прогулов', 'Уход не отмечен', 'Больничный, отпуск, отгул']];
  const S = WK.filter(w => monthDays(m).some(d => d <= TODAY() && activeOn(w, d))).map(w => monthSum(w, m)).sort((a, b) => byName(a.w, b.w));
  const withPay = GOT.pay === 1 && S.some(s => rateOf(s.w) || payItems(s.w, m).length);
  if (withPay) rows[0].push('Оплата', 'Ставка', 'Начислено', 'Премия', 'Аванс', 'К выплате');
  S.forEach(s => { const row = [s.w.name, s.w.pos, s.plan, s.came, hrs(s.work), s.late, s.lateMin, s.early, s.earlyMin, s.absent, s.noOut, s.excused]; if (withPay) { const o = payOf(s.w, m, s); row.push(o.r ? PAYT[o.r.t] : '', o.r ? o.r.v : '', o.base, o.bonus, o.adv, o.total); } rows.push(row); });
  rows.push([]); rows.push(['Дата', 'Работник', 'График', 'Приход', 'Уход', 'Отработано, ч', 'Нарушения']);
  S.forEach(s => s.days.forEach(r => { if (!r.active || (r.sc.off && !r.came)) return; const fm = r.marks.find(x => x.k === 'in'), lo = r.marks.filter(x => x.k === 'out').pop(); rows.push([r.d, s.w.name, r.sc.off ? (OVRK[r.sc.k] || 'выходной') : r.sc.f + '–' + r.sc.t, fm ? fT(fm.at) : '', lo ? fT(lo.at) : '', hrs(r.work), flagsOf(r).map(f => f[1]).join(', ')]); }));
  saveFile('otmetka-' + m + '.csv', csvOf(rows));
}

/* ---------- уведомления в Telegram ---------- */
let TG = null;
const TGAPI = 'https://api.telegram.org/bot';
function cleanTG(x) {
  x = x && typeof x === 'object' ? x : {};
  const token = /^\d{5,15}:[A-Za-z0-9_-]{20,80}$/.test(String(x.token || '')) ? String(x.token) : '';
  return {token, bot: str(x.bot, 64), chats: (Array.isArray(x.chats) ? x.chats : []).filter(c => c && /^-?\d{3,20}$/.test(String(c.id))).slice(0, 10).map(c => ({id: String(c.id), name: str(c.name, 60)})),
    late: x.late !== false, early: x.early !== false, absent: x.absent !== false, after: int(x.after, 5, 240, 15), sum: x.sum !== false, sumAt: isHM(x.sumAt) ? x.sumAt : '21:00', lunch: x.lunch !== false, photo: x.photo !== false};
}
const tgOn = () => !!(TG && TG.token && TG.chats.length);
function dataToBlob(d) { const a = String(d).split(','), b = atob(a[1] || ''), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Blob([u], {type: 'image/jpeg'}); }
/* отправка «в одну сторону»: ответ Telegram не читаем, поэтому браузер её не блокирует */
function tgRaw(item, cfg) {
  const t = cfg || TG, base = TGAPI + t.token + '/';
  return Promise.all(t.chats.map(c => {
    if (item.photo && t.photo) {
      const fd = new FormData(); fd.append('chat_id', c.id); fd.append('caption', item.text.slice(0, 1000)); fd.append('photo', dataToBlob(item.photo), 'photo.jpg');
      return fetch(base + 'sendPhoto', {method: 'POST', body: fd, mode: 'no-cors'});
    }
    const p = new URLSearchParams(); p.append('chat_id', c.id); p.append('text', item.text.slice(0, 4000));
    return fetch(base + 'sendMessage', {method: 'POST', body: p, mode: 'no-cors'});
  }));
}
/* без интернета сообщение ждёт в телефоне и уходит позже */
function tgPush(item) {
  if (!tgOn()) return;
  const it = {text: item.text, photo: item.photo || '', at: Date.now()};
  const later = () => { const q = lsGet('otm-tgq', []); q.push({text: it.text, at: it.at}); lsSet('otm-tgq', q.slice(-30)); };
  if (navigator.onLine === false) { later(); return; }
  tgRaw(it).catch(later);
}
function tgFlush() {
  if (!tgOn() || navigator.onLine === false) return;
  const q = lsGet('otm-tgq', []); if (!q.length) return;
  lsSet('otm-tgq', []);
  q.filter(x => Date.now() - x.at < 6 * 3600000).forEach(x => tgRaw({text: x.text + '\n(с задержкой: не было интернета)'}).catch(() => { const r = lsGet('otm-tgq', []); r.push(x); lsSet('otm-tgq', r.slice(-30)); }));
}
const tgHead = () => SET.shop ? SET.shop + '\n' : '';
/* сразу после отметки: опоздание, ранний уход, долгий обед */
function tgOnMark(w, k, at, photo) {
  if (!tgOn()) return;
  const T = ds(new Date(at)), sc = schedFor(w, T), m = minOf(at), prev = marksOf(w.id, T).filter(x => x.at < at - 1000);
  let text = '';
  if (k === 'in' && TG.late && !sc.off && m > tm(sc.f) + SET.grace && !prev.some(x => x.k === 'in')) text = '⏰ Опоздание: ' + w.name + '\nПриход в ' + fT(at) + ', начало в ' + sc.f + ' — на ' + durTxt(m - tm(sc.f)) + '.';
  else if (k === 'out' && TG.early && !sc.off && m < tm(sc.t) - SET.grace) text = '🚪 Ранний уход: ' + w.name + '\nУход в ' + fT(at) + ', конец в ' + sc.t + ' — раньше на ' + durTxt(tm(sc.t) - m) + '.';
  else if (k === 'lout' && TG.lunch && SET.lunch) { const l = prev.filter(x => x.k === 'lin').pop(); if (l && at - l.at > SET.lunchMax * 60000) text = '🍽 Долгий обед: ' + w.name + '\nОбед ' + durTxt((at - l.at) / 60000) + ' вместо ' + durTxt(SET.lunchMax) + '.'; }
  if (text) tgPush({text: tgHead() + text, photo: k === 'in' || k === 'out' ? photo : ''});
}
/* раз в минуту на телефоне у входа: кого ещё нет и итог дня */
function tgTick() {
  if (!tgOn() || ROLE !== 'kiosk' || !ready()) return;
  tgFlush();
  const T = TODAY(), now = nowS(), nowM = minOf(now);
  if (TG.absent) {
    const key = 'otm-tga-' + T, sent = lsGet(key, []);
    const list = WK.filter(w => activeOn(w, T)).map(w => ({w, r: dayInfo(w, T, marksOf(w.id, T), now)})).filter(x => !x.r.sc.off && !x.r.came && nowM >= tm(x.r.sc.f) + TG.after && nowM < tm(x.r.sc.t) && sent.indexOf(x.w.id) < 0);
    if (list.length) { tgPush({text: tgHead() + '❗ ' + fT(now) + ' ещё нет на работе:\n' + list.map(x => '• ' + x.w.name + ' (с ' + x.r.sc.f + ')').join('\n')}); lsSet(key, sent.concat(list.map(x => x.w.id))); }
  }
  if (TG.sum && nowM >= tm(TG.sumAt) && lsGet('otm-tgs', '') !== T) { lsSet('otm-tgs', T); tgPush({text: tgSummary(T, now)}); }
}
function tgSummary(T, now) {
  const rows = WK.filter(w => activeOn(w, T)).map(w => dayInfo(w, T, marksOf(w.id, T), now)), plan = rows.filter(r => !r.sc.off);
  const nm = r => r.w.name;
  const late = rows.filter(r => r.late), early = rows.filter(r => r.early), absent = plan.filter(r => !r.came && (r.absent || r.lateNow)), noOut = rows.filter(r => r.noOut), exc = rows.filter(r => r.excused);
  const work = rows.reduce((a, r) => a + r.work, 0);
  let t = tgHead() + '📋 Итог дня: ' + fDay(T) + '\nПришли: ' + plan.filter(r => r.came).length + ' из ' + plan.length;
  t += late.length ? '\n⏰ Опоздали: ' + late.map(r => nm(r) + ' (' + durTxt(r.late) + ')').join(', ') : '\n✅ Опозданий нет';
  if (absent.length) t += '\n❌ Не пришли: ' + absent.map(nm).join(', ');
  if (early.length) t += '\n🚪 Ушли раньше: ' + early.map(r => nm(r) + ' (' + durTxt(r.early) + ')').join(', ');
  if (noOut.length) t += '\n❔ Уход не отмечен: ' + noOut.map(nm).join(', ');
  if (exc.length) t += '\n🩺 Больничный, отпуск, отгул: ' + exc.map(r => nm(r) + ' — ' + OVRK[r.sc.k].toLowerCase()).join(', ');
  return t + '\nОтработано всего: ' + durTxt(work / 60000);
}

/* ---------- все фото за день ---------- */
function facesSheet(d) {
  const all = (MK[ym(d)] || []).concat(MK[ym(addD(d.slice(0, 7) + '-01', -1))] || []);
  const day = all.filter(m => m.d === d).sort((a, b) => a.at - b.at);
  const by = {};
  day.forEach(m => { (by[m.w] = by[m.w] || []).push(m); });
  const ids = Object.keys(by).sort((a, b) => (by[a][0].nm || '').localeCompare(by[b][0].nm || '', 'ru'));
  let h = head(relDay(d) ? relDay(d) + ', ' + fDs(d) : fDay(d), 'Все фото за день') + '<p class="small mut">Слева — фото этого работника с прошлого дня для сравнения. Если лицо не совпадает, нажмите на фото, чтобы рассмотреть.</p>';
  if (!ids.length) h += '<p class="mut mt">В этот день отметок нет.</p>';
  ids.forEach(id => {
    const w = wk(id), list = by[id], ref = all.filter(m => m.w === id && m.ph && m.d < d).sort((a, b) => b.at - a.at)[0];
    h += `<section class="fw mt"><b>${esc(w ? w.name : list[0].nm)}</b><div class="fgrid">`;
    if (ref) h += `<figure class="ref"><span class="ph"><img data-ph="${esc(ref.id)}" alt="Ранее: ${esc(list[0].nm)}"></span><figcaption>ранее, ${esc(fDs(ref.d))}</figcaption></figure>`;
    h += list.map(m => `<figure><span class="ph ${m.ph ? '' : 'none'}">${m.ph ? `<img data-ph="${esc(m.id)}" alt="${esc(list[0].nm + ', ' + fT(m.at))}">` : I.cam}</span><figcaption>${fT(m.at)} · ${esc(KINDS[m.k].toLowerCase())}${m.ph ? '' : '<br><span class="chip warn">без фото</span>'}</figcaption></figure>`).join('');
    h += '</div></section>';
  });
  openSheet(h, {kind: 'faces' + d});
  fillPhotos($('#sheet'));
  $$('#sheet img').forEach(i => i.onclick = () => { if (i.src) photoView(i.src, i.alt); });
}

}
function setView(v) {
  lsSet('otm-view', v); VIEW = v; K.step = 'pad'; K.code = ''; window.scrollTo(0, 0);
  if (v === 'kiosk') { subToday(); keepAwake(); }
  render();
}
function stopAll() { UNSUB.forEach(f => { try { f(); } catch (e) {} }); Object.keys(MSUB).forEach(k => { try { MSUB[k](); } catch (e) {} }); UNSUB = []; MSUB = {}; TODAYSUB = ''; MK = {}; Object.keys(GOT).forEach(k => delete GOT[k]); WK = []; OVR = {}; PAY = {rates: {}, m: {}}; TG = null; SET = cleanSet({}); }
const onErr = e => { const c = String((e && e.code) || ''); toast(/permission/.test(c) ? 'Нет доступа к данным. Проверьте, что почта добавлена владельцем.' : 'Связь с облаком прервалась. Закройте и откройте приложение.', true); };
function subBase() {
  UNSUB.push(FS.collection('workers').onSnapshot(s => { WK = s.docs.map(x => cleanW(x.id, x.data())).sort(byName); GOT.workers = 1; changed(); }, onErr));
  UNSUB.push(FS.collection('meta').doc('tg').onSnapshot(s => { TG = s.exists ? cleanTG(s.data()) : null; if (SHEET && SHEET.kind !== 'tg' && SHEET.redraw) SHEET.redraw(); }, () => {}));
  UNSUB.push(FS.collection('meta').doc('settings').onSnapshot(s => { SET = cleanSet(s.exists ? s.data() : {}); GOT.meta = 1; changed(); }, onErr));
  UNSUB.push(FS.collection('days').onSnapshot(s => { const o = {}; s.docs.forEach(x => { const v = x.data(); if (isDate(x.id) && v && v.o) o[x.id] = v.o; }); OVR = o; GOT.days = 1; changed(); }, onErr));
  if (ROLE === 'admin') UNSUB.push(FS.collection('pay').onSnapshot(s => {
    const p = {rates: {}, m: {}};
    s.docs.forEach(x => { const v = x.data() || {}; if (x.id === 'rates') { Object.keys(v.r || {}).forEach(k => { const r = v.r[k]; if (r && PAYT[r.t] && Number(r.v) > 0) p.rates[k] = {t: r.t, v: Number(r.v)}; }); } else if (/^\d{4}-\d{2}$/.test(x.id)) p.m[x.id] = {items: (Array.isArray(v.items) ? v.items : []).filter(i => i && i.id && i.w && (i.k === 'adv' || i.k === 'bonus') && Number(i.v) > 0).map(i => ({id: i.id, w: i.w, k: i.k, v: Number(i.v), d: isDate(i.d) ? i.d : '', nt: str(i.nt, 120)}))}; });
    PAY = p; GOT.pay = 1; changed();
  }, e => { GOT.pay = -1; changed(); }));
}
function snapMarks(s) { return s.docs.map(x => cleanM(x.id, x.data({serverTimestamps: 'estimate'}), x.metadata && x.metadata.hasPendingWrites)); }
/* отметки за месяц (владелец) */
function subMonth(m) {
  if (MSUB[m] || !FS) return;
  const keys = Object.keys(MSUB).filter(k => /^\d{4}-\d{2}$/.test(k));
  if (keys.length >= 3) { const old = keys.filter(k => k !== ym(TODAY()) && k !== m)[0]; if (old) { MSUB[old](); delete MSUB[old]; delete MK[old]; } }
  MSUB[m] = FS.collection('marks').where('d', '>=', m + '-01').where('d', '<=', m + '-31').onSnapshot(s => { MK[m] = snapMarks(s); GOT['m' + m] = 1; changed(); }, onErr);
}
/* отметки за сегодня (телефон у входа) */
function subToday() {
  const T = TODAY();
  if (ROLE === 'admin') { subMonth(ym(T)); GOT.today = 1; return; }
  /* у входа держим отметки за весь месяц: из них же считается «Мой месяц» */
  const m = ym(T);
  if (TODAYSUB === m) return;
  if (MSUB.today) MSUB.today();
  TODAYSUB = m; GOT.today = 0;
  MSUB.today = FS.collection('marks').where('d', '>=', m + '-01').where('d', '<=', m + '-31').onSnapshot(s => {
    const list = snapMarks(s); MK = {}; MK[m] = list; GOT.today = 1;
    // поправка часов телефона по времени сервера
    s.docs.forEach(x => { const v = x.data(); if (v.dev === DEVID && !(x.metadata && x.metadata.hasPendingWrites) && typeof v.ct === 'number') { const ts = tsMs(v.ts); if (ts != null && Math.abs(ts - v.ct) < 600000) lsSet('otm-off', ts - v.ct); } });
    changed();
  }, onErr);
}
/* старые фото удаляются сами (раз в день, с телефона владельца) */
async function cleanPhotos() {
  const T = TODAY(); if (lsGet('otm-clean', '') === T) return; lsSet('otm-clean', T);
  try {
    const s = await FS.collection('photos').where('day', '<', addD(T, -SET.keep)).limit(150).get();
    for (const x of s.docs) { try { await x.ref.delete(); } catch (e) {} }
  } catch (e) {}
}
function startApp() {
  if (!CFG || !window.firebase || !firebase.initializeApp) {
    $('#app').innerHTML = `<section class="card mt"><h3>Не удалось загрузить программу</h3><p class="small">${CFG ? 'Проверьте интернет и откройте страницу заново.' : 'Программа ещё не подключена к облаку.'}</p></section>`;
    return;
  }
  if (!firebase.apps.length) firebase.initializeApp(CFG);
  FS = firebase.firestore();
  try { FS.enablePersistence({synchronizeTabs: true}).catch(() => {}); } catch (e) {}
  firebase.auth().onAuthStateChanged(u => {
    const prev = USER; USER = u || null;
    if (!u) { stopAll(); ROLE = ''; VIEW = ''; render(); $('#app').innerHTML = ''; loginScreen(); return; }
    if (prev && prev.uid === u.uid) return;
    hideLogin(); stopAll();
    ROLE = isAdminEmail(u.email) ? 'admin' : 'kiosk';
    VIEW = ROLE === 'admin' ? (lsGet('otm-view', '') === 'kiosk' ? 'kiosk' : 'admin') : 'kiosk';
    subBase(); subToday();
    if (ROLE === 'admin') { subMonth(ym(TODAY())); setTimeout(() => { if (GOT.meta) cleanPhotos(); }, 8000); }
    if (VIEW === 'kiosk') keepAwake();
    render();
  });
}
/* переключатели вкладок и шапки */
$$('.tabs button').forEach(b => b.onclick = () => { A.tab = b.dataset.tab; if (A.tab === 'day') A.d = TODAY(); window.scrollTo(0, 0); render(); });
$('#openSet').onclick = settingsSheet;
/* смена дня и живое обновление */
setInterval(() => {
  if (!USER) return;
  if (TODAYSUB && TODAYSUB !== ym(TODAY()) && ROLE === 'kiosk') { subToday(); }
  try { tgTick(); } catch (e) {}
  if (VIEW === 'admin' && A.tab === 'day' && !SHEET) render();
  else if (VIEW === 'admin' && SHEET && SHEET.redraw && SHEET.kind && SHEET.kind.indexOf('wd') === 0) SHEET.redraw();
}, 60000);
startApp();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body></html>

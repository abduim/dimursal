<style>

}

  --wa:#1F7A4D; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px -16px rgba(0,0,0,.85); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.mt{margin-top:16px}.mt8{margin-top:8px}

.stack{display:grid;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;text-decoration:none;text-align:center;line-height:1.15}

.row .t{flex:1;min-width:0;display:grid;gap:2px}
.row .t b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}

.cd.good i{background:var(--good)}.cd.warn i{background:var(--warn)}.cd.bad i{background:var(--bad)}.cd.info i{background:var(--info)}.cd.mut i{background:var(--line)}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}

.legend i.good{background:var(--good)}.legend i.warn{background:var(--warn)}.legend i.bad{background:var(--bad)}.legend i.info{background:var(--info)}.legend i.mut{background:var(--line)}
/* лист снизу */
#sheet{position:fixed;z-index:50;top:0;right:0;bottom:0;left:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}

.kt{display:grid;min-width:0;line-height:1.25}.kt b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kt span{font-size:14px;color:var(--mut);font-weight:600}

.kcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 16px;text-align:center;box-shadow:var(--shadow)}
.kq{font-size:20px;font-weight:750}

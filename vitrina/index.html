  if (all > SHOWN) g.insertAdjacentHTML('beforeend', `<div style="grid-column:1/-1;text-align:center;margin-top:6px"><button class="btn soft" id="more">${LANG === 'kz' ? 'Тағы көрсету' : 'Показать ещё'} (${all - SHOWN})</button></div>`);
  const mo = $('#more'); if (mo) mo.onclick = () => { SHOWN += 40; grid(); };
  photos(g);
}
function bump(id, d) { const was = BAG[id] || 0; BAG[id] = Math.max(0, was + d); if (!BAG[id]) delete BAG[id]; saveBag(); if (!was && d > 0) toast(t('added')); }
$('#app').addEventListener('click', e => {
  const b = e.target.closest('[data-d]'); if (b) { bump(b.dataset.id, Number(b.dataset.d)); grid(); bagUI(); return; }
  const o = e.target.closest('[data-open]'); if (o) pSheet(o.dataset.open);
});
function pSheet(id) {
  const x = items().find(y => y.id === id); if (!x) return;
  const n = BAG[x.id] || 0, b = brand(x.name), sim = items().filter(y => y.id !== x.id && y.cat === x.cat).sort((a, c) => (c.src ? 1 : 0) - (a.src ? 1 : 0)).slice(0, 10);
  $('#sheet .panel').innerHTML = `<div class="sh"><span></span><button class="x" id="shX" aria-label="×">${I.close}</button></div>
    <div class="pbig"${x.src ? ` data-src="${esc(x.src)}"` : ''}>${art(SHAPE(x.cat || ''))}${b && !x.src ? `<span class="br">${esc(b)}</span>` : ''}</div>
    <h2 class="pd-nm" id="shT">${esc(x.name)}</h2>
    <div class="pd-pr"><b>${fmt(x.price)}</b>${x.stock ? `<span>${esc(t2('inst2'))}</span>` : `<span style="background:var(--blush);color:var(--mut)">${esc(t('wait'))}</span>`}${x.hit ? `<span style="background:#FFF1E6;color:#C2410C">🔥 ${esc(t2('hit'))}</span>` : ''}${x.nw ? `<span style="background:var(--pink-soft);color:var(--pink)">✨ ${esc(t2('nw'))}</span>` : ''}</div>
    ${x.desc ? `<p class="pd-ds">${esc(x.desc)}</p>` : ''}
    <div class="pd-act">${n ? `<span class="stp"><button data-pd="-1" aria-label="−">${I.minus}</button><b>${n}</b><button data-pd="1" aria-label="+">${I.plus}</button></span>` : `<button class="btn" data-pd="1">${I.plus}${esc(t2('addO'))}</button>`}<button class="btn share" id="pdSh">${esc(t2('share'))}</button></div>
    ${n ? `<button class="btn wa" style="width:100%;margin-top:10px" id="pdBag">${esc(t('bag')(Object.values(BAG).reduce((a, v) => a + v, 0)))}</button>` : ''}
    ${sim.length ? `<section class="sec"><h2>${esc(t2('sim'))}</h2><div class="hs">${sim.map(y => `<article class="card"><div class="ph" data-po="${esc(y.id)}"${y.src ? ` data-src="${esc(y.src)}"` : ''}>${art(SHAPE(y.cat || ''))}${brand(y.name) && !y.src ? `<span class="br">${esc(brand(y.name))}</span>` : ''}</div><div class="cb" data-po="${esc(y.id)}"><span class="nm">${esc(y.name)}</span><span class="price">${fmt(y.price)}</span></div></article>`).join('')}</div></section>` : ''}`;
  const sh = $('#sheet'); sh.hidden = false; $('#toast').hidden = true; document.body.classList.add('noscroll'); bagUI();
  $('.panel', sh).scrollTop = 0;
  try { history.replaceState(null, '', '#p=' + encodeURIComponent(x.id)); } catch (e) {}
  photos(sh);
  $('#shX').onclick = closeSheet;
  $$('[data-pd]', sh).forEach(bt => bt.onclick = () => { bump(x.id, Number(bt.dataset.pd)); grid(); pSheet(x.id); });
  $$('[data-po]', sh).forEach(bt => bt.onclick = () => pSheet(bt.dataset.po));
  const pb = $('#pdBag'); if (pb) pb.onclick = bagSheet;
  $('#pdSh').onclick = async () => {
    const url = location.href.split('#')[0] + '#p=' + encodeURIComponent(x.id), text = x.name + ' — ' + fmt(x.price) + ' · Dimursal';
    try { if (navigator.share) { await navigator.share({title: x.name, text, url}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + '\n' + url); toast(t2('lcop')); } catch (e) { toast(url); }
  };
}
function bagUI() {
  const l = bagList(), n = l.reduce((a, x) => a + x.n, 0), s = l.reduce((a, x) => a + x.n * x.it.price, 0);
  $('#bag').hidden = !n || !$('#sheet').hidden;
  if (n) { $('#bagT').textContent = t('bag')(n); $('#bagS').textContent = fmt(s); }
}
function bagSheet() {
  const l = bagList(); if (!l.length) { closeSheet(); return; }
  const s = l.reduce((a, x) => a + x.n * x.it.price, 0);
  $('#sheet .panel').innerHTML = `<div class="sh"><h2 id="shT">${esc(t('bagH'))}</h2><button class="x" id="shX" aria-label="×">${I.close}</button></div>
    ${l.map(x => `<div class="li"><span class="t"><b>${esc(x.it.name)}</b><span>${fmt(x.it.price)}</span></span><span class="stp"><button data-bd="-1" data-id="${esc(x.it.id)}" aria-label="−">${I.minus}</button><b>${x.n}</b><button data-bd="1" data-id="${esc(x.it.id)}" aria-label="+">${I.plus}</button></span></div>`).join('')}
    <div class="tot"><span>${esc(t('total'))}</span><b>${fmt(s)}</b></div>
    <a class="btn wa" style="width:100%" href="${esc(waUrl(bagText()))}" target="_blank" rel="noopener">${I.wa}${esc(t('send'))}</a>
    <p class="sendnote">${esc(t('sendnote'))}</p><button class="btn soft small" id="bgClr" style="margin-top:12px">${esc(t('clear'))}</button>`;
  $('#sheet').hidden = false; $('#toast').hidden = true; document.body.classList.add('noscroll'); bagUI();
  $('#shX').onclick = closeSheet;
  $('#bgClr').onclick = () => { BAG = {}; saveBag(); closeSheet(); grid(); };
  $$('[data-bd]').forEach(b => b.onclick = () => { bump(b.dataset.id, Number(b.dataset.bd)); grid(); bagSheet(); });
}
function closeSheet() { if (/^#p=/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} } $('#sheet').hidden = true; document.body.classList.remove('noscroll'); bagUI(); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
$('#bagBtn').onclick = bagSheet;
$$('.lang button').forEach(b => b.onclick = () => { LANG = b.dataset.lang; ls.set('dv-lang', LANG); render(); });
render();
loadCatalog();
</script>

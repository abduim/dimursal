<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Склад"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF4F1">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Dimursal склад</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Great+Vibes&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Касса как бумажный чек: сверху поиск и сканер, под ним чек с перфорацией, ниже товары плиткой и списком; подробности в нижних листах */
:root{
  --bg:#FBF4F1; --surface:#FFFFFF; --soft:#F6E7E3; --ink:#2B1D22; --mut:#6F5C66; --line:#EDDCD8;
  --acc:#9E3B5C; --acc-ink:#FFFFFF; --gold:#B08850; --gold-hi:#D2B07A; --gold-ink:#7E5F33;
  --good:#2E7D4F; --warn:#9A5B00; --bad:#B3261E; --bad-ink:#FFFFFF; --scrim:rgba(43,29,34,.45);
  --paper:#FFFEFB; --c-rev:#2a78d6; --c-profit:#b8336a; --c-cost:#D8CBD0;
  --t0:#F3E1E6; --t1:#F1E5D5; --t2:#E1E7F2; --t3:#DFEEE4; --t4:#EAE2F3; --t5:#F6E2D8; --t6:#ECE7DC; --t7:#ECE5E8;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --script:"Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1316; --surface:#241A1F; --soft:#30232A; --ink:#F6ECEE; --mut:#BCA9B1; --line:#3A2C33;
  --acc:#E89BB4; --acc-ink:#2B0F19; --gold:#D9B77E; --gold-hi:#F2DDB0; --gold-ink:#D9B77E;
  --good:#7DD3A0; --warn:#F2B964; --bad:#FF8A80; --bad-ink:#2B0F19; --scrim:rgba(0,0,0,.6);
  --paper:#2A1F25; --c-rev:#3987e5; --c-profit:#d6588a; --c-cost:#55444D;
  --t0:#43293A; --t1:#3E3124; --t2:#27324A; --t3:#22392B; --t4:#352A47; --t5:#47302A; --t6:#383226; --t7:#3A2E33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1316; --surface:#241A1F; --soft:#30232A; --ink:#F6ECEE; --mut:#BCA9B1; --line:#3A2C33;
  --acc:#E89BB4; --acc-ink:#2B0F19; --gold:#D9B77E; --gold-hi:#F2DDB0; --gold-ink:#D9B77E;
  --good:#7DD3A0; --warn:#F2B964; --bad:#FF8A80; --bad-ink:#2B0F19; --scrim:rgba(0,0,0,.6);
  --paper:#2A1F25; --c-rev:#3987e5; --c-profit:#d6588a; --c-cost:#55444D;
  --t0:#43293A; --t1:#3E3124; --t2:#27324A; --t3:#22392B; --t4:#352A47; --t5:#47302A; --t6:#383226; --t7:#3A2E33; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:12px 8px;border-bottom:1px solid var(--gold)}
.wm{font:400 42px/1.05 var(--script);color:var(--gold-ink);padding:6px 4px 0 0}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.wm{background:linear-gradient(100deg,var(--gold-ink) 0%,var(--gold-hi) 40%,var(--gold) 62%,var(--gold-ink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}}
.top-sub{font-size:13px;color:var(--gold-ink);margin-top:14px;font-weight:700;letter-spacing:.02em}
.sync{margin-left:auto;font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:block}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0;flex:none}
.top .icon-btn{margin-left:auto}
.top .sync+.icon-btn{margin-left:0}
.icon-btn.sm{width:40px;height:40px}
main{max-width:560px;margin:0 auto;padding-block:8px 24px}
h1{font:700 34px/1.08 var(--display);margin:8px 0 12px;text-wrap:balance}
h2{font:700 25px/1.15 var(--display);margin:0 0 8px;text-wrap:balance}
h3{font:700 15px/1.3 var(--body);margin:0 0 10px}
p{margin:0}
.kicker{font-size:14px;color:var(--mut);margin:0;font-weight:600}
.mut{color:var(--mut)} .small{font-size:14px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.mt{margin-top:16px} .mt8{margin-top:8px}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;text-align:center;line-height:1.2;text-decoration:none}
.btn svg{width:20px;height:20px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--soft);color:var(--ink);border-color:var(--soft)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px;border-radius:12px}
.btn.big{min-height:58px;font-size:18px;border-radius:16px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.btn:disabled{opacity:.55;cursor:default}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row2>label.f{align-content:end}
.row2>.btn{padding:0 10px;font-size:15px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.full{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button .c{font-weight:700;color:var(--mut);margin-left:4px}
.chips button[aria-pressed="true"] .c{color:inherit;opacity:.75}
.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.scrollx::-webkit-scrollbar{display:none}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.segc button{min-height:40px;border:0;border-radius:11px;background:transparent;font-size:14px;font-weight:700;color:var(--mut);padding:0 4px;line-height:1.15}
.segc button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
label.f{display:grid;gap:6px;font-size:14px;color:var(--mut);font-weight:600}
.lbl{display:block;font-size:13px;color:var(--mut);font-weight:700}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:16px;color:var(--ink);font-weight:400}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input[type="search"]{-webkit-appearance:none;appearance:none}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:1.3em}
.hint{font-size:13px;color:var(--mut)}
.form{display:grid;gap:14px}
.linkbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:8px 0;color:var(--acc);font-weight:700;font-size:14px;min-height:40px}
.linkbtn svg{width:16px;height:16px}
.empty{color:var(--mut);padding:6px 0}
.busy{display:flex;align-items:center;gap:12px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--acc);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:1px 9px 1px 6px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;line-height:1.55}
.chip svg{width:14px;height:14px;stroke-width:2.2}
.c-good{color:var(--good)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-gold{color:var(--gold-ink)} .c-mut{color:var(--mut)}
.claude{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--gold-ink)}
.claude svg{width:14px;height:14px}
.banner{display:grid;gap:10px;border:1px dashed var(--gold);background:var(--surface);border-radius:16px;padding:12px 14px;margin:6px 0 12px}
.banner p{font-size:14px}
.banner .acts{display:flex;flex-wrap:wrap;gap:8px}
/* миниатюры товаров */
.th{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--tint,var(--t7));overflow:hidden;flex:none}
.th .mono{font:italic 600 22px/1 var(--display);color:var(--ink)}
.th img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;max-width:none}
.th.lg{width:84px;height:84px;border-radius:18px}
.th.lg .mono{font-size:38px}
.th.sm{width:38px;height:38px;border-radius:10px}
.th.sm .mono{font-size:19px}
/* остаток */
.stk{display:grid;justify-items:end;gap:1px;flex:none;min-width:52px;text-align:right}
.stk b{font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.stk span{font-size:12px;font-weight:700;color:var(--mut)}
.stk.low b,.stk.low span{color:var(--warn)}
.stk.out b,.stk.out span{color:var(--bad)}
/* поиск и сканер */
.kbar{display:flex;gap:10px;align-items:stretch}
.srch{position:relative;flex:1;min-width:0;display:block}
.srch svg{position:absolute;left:14px;top:50%;margin-top:-10px;width:20px;height:20px;color:var(--mut);pointer-events:none}
.srch input{padding-left:44px;min-height:54px;border-radius:16px;font-size:17px}
.scanbtn{width:58px;min-height:54px;border-radius:16px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;padding:0;flex:none}
.scanbtn svg{width:28px;height:28px}
/* списки товаров */
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;color:var(--ink);min-height:68px}
.prow .pr-t{flex:1;min-width:0;display:grid;gap:1px}
.prow .pr-t b{font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.prow .pr-t span{font-size:13px;color:var(--mut);line-height:1.35}
.prow .pr-t span b.pr-p{font-size:14px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.prow .plus{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--acc);flex:none}
.prow .plus svg{width:20px;height:20px;stroke-width:2.4}
.prow .inc{min-width:24px;height:24px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.bump{animation:bump .28s ease-out}
@keyframes bump{40%{transform:scale(.97);background:var(--soft)}}
.more{display:flex;justify-content:center;margin-top:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-h h3{margin:0}
/* касса: сегодня */
.today{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--ink);margin-top:14px}
.today .td-l{font-size:13px;color:var(--mut);font-weight:700;grid-column:1}
.today .td-v{font:800 30px/1.15 var(--body);grid-column:1;font-variant-numeric:tabular-nums}
.today .td-m{font-size:14px;color:var(--mut);grid-column:1}
.today .td-go{grid-column:2;grid-row:1 / span 3;align-self:center;display:flex;align-items:center;gap:2px;font-weight:700;font-size:14px;color:var(--acc)}
.today .td-go svg{width:18px;height:18px}
/* плитки «часто покупают» */
.tiles6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pt{position:relative;display:grid;justify-items:center;align-content:start;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px 10px;color:var(--ink);text-align:center;min-height:136px}
.pt .th{width:56px;height:56px;border-radius:14px}
.pt .th .mono{font-size:26px}
.pt .pt-n{font-size:13px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:2.5em}
.pt .pt-p{font-size:13px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
.pt .inc{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.pt.out .th{opacity:.5}
/* чек */
.rcpt{position:relative;background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px 18px;margin:14px 0 20px;box-shadow:0 10px 24px -18px rgba(43,29,34,.35)}
.rcpt::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-10px;height:10px;background:radial-gradient(circle at 8px 10px,transparent 6px,var(--paper) 6.5px) 0 0/16px 10px repeat-x}
.rc-h{display:flex;align-items:baseline;gap:10px}
.rc-h h2{margin:0}
.rc-h .mut{font-size:14px;font-weight:600}
.rc-h .linkbtn{margin-left:auto}
.rc-lines{list-style:none;margin:6px 0 0;padding:0}
.ln{padding:10px 0;border-bottom:1px dashed var(--line)}
.ln-top{display:flex;gap:10px;align-items:flex-start}
.ln-name{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.ln-rm{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--mut);display:grid;place-items:center;padding:0;margin:-4px -6px 0 0;flex:none}
.ln-rm svg{width:18px;height:18px}
.ln-bot{display:flex;align-items:center;gap:8px;margin-top:6px}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);flex:none}
.stp button{width:38px;height:38px;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--ink)}
.stp button svg{width:18px;height:18px;stroke-width:2.4}
.stp .q{width:auto;min-width:34px;padding:0 4px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.stp input{width:56px;min-height:38px;height:38px;border:0;padding:0 4px;text-align:center;font-weight:800;background:transparent}
.ln-x{font-size:14px;color:var(--mut);white-space:nowrap}
.prbtn{border:0;background:none;padding:6px 2px;font-weight:700;color:var(--ink);font-size:15px;text-decoration:underline dotted var(--mut);text-underline-offset:3px;font-variant-numeric:tabular-nums}
.prin{width:96px;min-height:38px;height:38px;padding:0 8px;font-weight:700}
.lead{flex:1;min-width:12px;border-bottom:2px dotted var(--line);align-self:flex-end;margin-bottom:9px}
.ln-sum{font-weight:800;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ln-old{font-size:13px;color:var(--mut);text-decoration:line-through;margin-left:6px;font-weight:600}
.ln-warn{font-size:13px;color:var(--warn);font-weight:700;margin-top:4px;display:flex;align-items:center;gap:6px}
.ln-warn svg{width:16px;height:16px}
.rc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.rc-row .grow{flex:1;min-width:0}
.rc-row input{width:110px;min-height:42px;height:42px}
.rc-row .segc{padding:3px;border-radius:12px}
.rc-row .segc button{min-height:34px;min-width:38px;font-size:15px}
.rc-total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 0 10px}
.rc-total span{font-weight:700;font-size:16px}
.rc-total b{font:800 32px/1.1 var(--body);font-variant-numeric:tabular-nums}
.pay{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 12px}
.pay button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.pay button svg{width:18px;height:18px}
.pay button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.given{display:grid;gap:8px;margin:0 0 12px}
.given .gl{display:flex;align-items:center;gap:10px}
.given .gl input{flex:1;min-width:0}
.given .chips button{min-height:38px;padding:0 12px;font-size:14px;font-variant-numeric:tabular-nums}
.change{font-size:16px;font-weight:700}
.change b{font-size:20px;color:var(--good);font-variant-numeric:tabular-nums}
.change.bad b{color:var(--bad)}
.debtf{display:grid;gap:8px;margin:0 0 12px}
/* мини-чек внизу */
#cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#cartbar button{pointer-events:auto;max-width:560px;margin:0 auto 8px;width:100%;display:flex;align-items:center;gap:10px;min-height:52px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);padding:0 16px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
#cartbar button b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:17px}
/* страницы */
.pg-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pg-h h1{margin:8px 0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.tile .v{font:800 23px/1.15 var(--body);overflow-wrap:anywhere}
.tile .l{font-size:13px;color:var(--mut);font-weight:600;line-height:1.3}
.tile .d{font-size:13px;font-weight:700}
.sortrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.sortrow select{width:auto;min-height:40px;padding:6px 10px;font-size:14px;font-weight:600;border-radius:10px}
.li{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{min-width:0;flex:1}
.li .t b{display:block;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.li .t span{display:block;font-size:13px;color:var(--mut);line-height:1.35}
.li .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.li .v small{display:block;font-size:12px;color:var(--mut);font-weight:600}

function memDB(key, seed) {

    const col = data[c] || {};
    const docs = Object.keys(col).sort().map(id => ({id, exists: true, data: () => col[id], metadata: {fromCache: false, hasPendingWrites: false}}));
    return {docs, size: docs.length, empty: !docs.length, metadata: {fromCache: false, hasPendingWrites: false}, docChanges: () => []};
  };
  const emit = c => (subs[c] || []).slice().forEach(f => { try { f(snapOf(c)); } catch (e) { console.error(e); } });
  return {
    mem: true, data: () => data,
    collection(c) { return {onSnapshot(next) { (subs[c] = subs[c] || []).push(next); setTimeout(() => { if ((subs[c] || []).includes(next)) next(snapOf(c)); }, 0); return () => { subs[c] = (subs[c] || []).filter(f => f !== next); }; }}; },
    doc(p) {

        set: async o => { (data[c] = data[c] || {})[id] = clone(o); persist(); emit(c); },

async function waitFor(f, ms) { const t0 = Date.now(); while (Date.now() - t0 < (ms || 3000)) { const v = f(); if (v) return v; await sleep(60); } return f(); }
function stockSummary() {
  let units = 0, cost = 0, retail = 0;
  PR.forEach(p => { const s = Math.max(0, stockOf(p)); units += s; cost += s * p.buy; retail += s * p.sell; });
  return {kinds: PR.length, units, cost, retail};
}
function goodsFilters() {
  const c = {low: 0, out: 0, exp: 0, nocode: 0};
  PR.forEach(p => { const s = stockOf(p); if (s <= 0) c.out++; else if (s <= minOf(p)) c.low++; if (p.exp && s > 0 && monthsLeft(p.exp) <= 3) c.exp++; if (!codesOf(p).length) c.nocode++; });
  const l = [['all', 'Все', PR.length], ['low', 'Мало', c.low], ['out', 'Нет в наличии', c.out]];
  if (c.exp) l.push(['exp', 'Срок годности', c.exp]);
  if (c.nocode) l.push(['nocode', 'Без штрихкода', c.nocode]);
  const cats = catsInUse(); if (cats.length > 1) cats.forEach(k => l.push(['cat:' + k, k, PR.filter(p => (p.cat || 'Другое') === k).length]));

}
function goodsList() {
  let l = GQ.trim() ? findProducts(GQ, 1000) : PR.slice();
  if (GF === 'low') l = l.filter(p => { const s = stockOf(p); return s > 0 && s <= minOf(p); });
  else if (GF === 'out') l = l.filter(p => stockOf(p) <= 0);
  else if (GF === 'exp') l = l.filter(p => p.exp && stockOf(p) > 0 && monthsLeft(p.exp) <= 3);
  else if (GF === 'nocode') l = l.filter(p => !codesOf(p).length);
  else if (GF.indexOf('cat:') === 0) { const k = GF.slice(4); l = l.filter(p => (p.cat || 'Другое') === k); }
  const S = {
    name: (a, b) => byName(a, b),
    stock: (a, b) => stockOf(a) - stockOf(b) || byName(a, b),
    sold: (a, b) => (D.s30[b.id] || 0) - (D.s30[a.id] || 0) || byName(a, b),
    fresh: (a, b) => (b.ts || 0) - (a.ts || 0) || byName(a, b),
    value: (a, b) => Math.max(0, stockOf(b)) * b.buy - Math.max(0, stockOf(a)) * a.buy || byName(a, b),

  if (!GQ.trim() || GSORT !== 'name') l.sort(S[GF === 'exp' ? 'exp' : GSORT] || S.name);
  return l;
}

/* ---------- Облачная база Firebase: тот же интерфейс, что у базы Claude ---------- */
const FB_CFG = window.FB_CFG || null;
let FB = null, FS = null, FBUSER = null;
const fbCode = e => {
  const c = String((e && e.code) || '').replace(/^(firestore|auth)\//, '');
  if (c === 'permission-denied') return 'invalid_argument';
  if (c === 'resource-exhausted') return 'resource_exhausted';
  if (c === 'unauthenticated') return 'revoked';
  if (c === 'unavailable' || c === 'deadline-exceeded') return 'unavailable';
  return c || 'unknown';
};
const fbErr = e => { const o = {code: fbCode(e), message: e && e.message}; return o; };
const online = () => navigator.onLine !== false;
/* запись в облако: без интернета запись ждёт в телефоне и уйдёт сама, поэтому долго не ждём */
function fbWrite(p) {
  let late = !online();
  const q = Promise.resolve(p).catch(e => { const x = fbErr(e); if (late) toast(x.code === 'invalid_argument' || x.code === 'revoked' ? 'Облако не приняло последнее изменение: нет доступа. Выйдите и войдите заново.' : 'Последнее изменение не сохранилось в облаке. Проверьте его и повторите.', true); throw x; });
  q.catch(() => {});
  if (late) return Promise.resolve('queued');
  return Promise.race([q, sleep(4000).then(() => { late = true; return 'queued'; })]);
}
function fsDB(fs) {
  const plain = o => JSON.parse(JSON.stringify(o));
  const ref = p => fs.doc(p);
  const wrapSnap = s => ({id: s.id, exists: !!s.exists, data: () => (s.exists ? s.data() : undefined), metadata: s.metadata || {fromCache: false, hasPendingWrites: false}});
  return {
    fs: true,
    collection(c) {
      return {onSnapshot(next, err) {
        return fs.collection(c).onSnapshot(s => next({docs: s.docs.map(wrapSnap), size: s.size, empty: s.empty, metadata: s.metadata, docChanges: () => []}), e => { if (err) err(fbErr(e)); });
      }};
    },
    doc(p) {
      const r = ref(p);
      return {
        id: r.id, path: p,
        get: () => (online() ? r.get() : r.get({source: 'cache'}).catch(() => r.get())).then(wrapSnap, e => { throw fbErr(e); }),
        getCached: () => r.get({source: 'cache'}).catch(() => r.get()).then(wrapSnap, e => { throw fbErr(e); }),
        set: o => fbWrite(r.set(plain(o))),
        update: o => fbWrite(r.update(plain(o))),
        delete: () => fbWrite(r.delete()),
        acquire: async () => ({acquired: true})
      };
    },
    /* изменение документа без потери чужих правок: транзакция, а без интернета — по копии в телефоне */
    async tx(p, fn) {
      const r = ref(p);
      const local = async () => {
        let s = null; try { s = await r.get({source: 'cache'}); } catch (e) { s = null; }
        if (!s && online()) s = await r.get();
        const cur = s && s.exists ? clone(s.data()) : null;
        const next = fn(cur);
        if (next === undefined) return cur;
        if (next === null) { if (cur) await fbWrite(r.delete()); return null; }
        await fbWrite(r.set(plain(next)));
        return next;
      };
      if (!online()) return local();
      try {
        return await Promise.race([
          fs.runTransaction(async t => {
            const s = await t.get(r);
            const cur = s.exists ? clone(s.data()) : null;
            const next = fn(cur);
            if (next === undefined) return cur;
            if (next === null) { if (cur) t.delete(r); return null; }
            t.set(r, plain(next));
            return next;
          }),
          sleep(10000).then(() => { throw {code: 'unavailable'}; })
        ]);
      } catch (e) {
        const c = fbCode(e);
        if (c === 'unavailable' || c === 'failed-precondition' || c === 'aborted') return local();
        throw fbErr(e);
      }
    }
  };
}

  data.products[ids[0]].qty += 1;
  return data;
}

/* ---------- Bluetooth-сканер (работает как клавиатура) ---------- */
const KB = {buf: '', t: 0};
document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const now = Date.now();
  if (now - KB.t > 80) KB.buf = '';
  KB.t = now;
  if (e.key === 'Enter') { const code = KB.buf; KB.buf = ''; if (code.length >= 6) { e.preventDefault(); routeCode(code); } return; }
  if (e.key && e.key.length === 1 && /[0-9A-Za-z]/.test(e.key)) KB.buf += e.key;
});
function routeCode(code) {
  if (!ready()) return;
  if (!PR.length) { if ($('#sheet').hidden) goodsCode(code); return; }
  if (SHEET && SHEET.kind === 'rcv') { rcvCode(code); return; }
  if (!$('#sheet').hidden) return;
  if (!$('#done').hidden) closeDone();
  if (tab === 'goods' || tab === 'zakup') goodsCode(code);
  else { if (tab !== 'kassa') go('kassa'); kassaCode(code); }
}

  const L = legacyLocal(), data = REAL.data();
  if (L && !legacyDone() && !Object.keys(data.products || {}).length) { Object.assign(data, memFromDocs(fromLegacy(L))); lsSet(LKEY, data); setLegacyDone(); }
  connect(REAL, 'local');
})();
